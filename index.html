<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat AI com Voz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            height: 90vh;
            background: #161b22;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        header {
            padding: 20px 24px;
            border-bottom: 1px solid #30363d;
            background: #0d1117;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #58a6ff, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #8b949e;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #1f6feb;
        }

        .message .content {
            background: #21262d;
            padding: 12px 16px;
            border-radius: 16px;
            border-top-left-radius: 4px;
            max-width: 80%;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .content {
            background: #1f6feb;
            border-top-left-radius: 16px;
            border-top-right-radius: 4px;
        }

        .message.bot .content {
            background: #21262d;
            border-top-left-radius: 4px;
            border-top-right-radius: 16px;
        }

        .loading-dots {
            display: inline-flex;
            gap: 4px;
        }

        .loading-dots span {
            animation: dotPulse 1.2s infinite;
            font-size: 1.5rem;
            line-height: 0.8;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotPulse {
            0%,
            80%,
            100% {
                opacity: 0.3;
            }
            40% {
                opacity: 1;
            }
        }

        .input-area {
            display: flex;
            gap: 12px;
            padding: 16px 24px 20px;
            background: #0d1117;
            border-top: 1px solid #30363d;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #30363d;
            background: #161b22;
            color: #e6edf3;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        .input-area input:focus {
            border-color: #58a6ff;
        }

        .input-area input::placeholder {
            color: #8b949e;
        }

        .input-area button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .voice-btn {
            background: #21262d;
            color: #e6edf3;
        }

        .voice-btn:hover {
            background: #30363d;
            transform: scale(1.05);
        }

        .voice-btn.listening {
            background: #da3633;
            animation: pulse 1s infinite;
            color: white;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .send-btn {
            background: #1f6feb;
            color: white;
        }

        .send-btn:hover {
            background: #388bfd;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            padding: 8px 24px;
            font-size: 0.8rem;
            color: #8b949e;
            background: #0d1117;
            border-top: 1px solid #30363d;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status.active {
            color: #3fb950;
        }

        .status.error {
            color: #da3633;
        }

        .chat-area::-webkit-scrollbar {
            width: 6px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: #0d1117;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 8px;
        }

        .chat-area::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        @media (max-width: 600px) {
            .container {
                height: 95vh;
                border-radius: 16px;
            }

            .message .content {
                max-width: 90%;
                font-size: 0.95rem;
            }

            .input-area {
                padding: 12px 16px 16px;
                gap: 8px;
            }

            .input-area button {
                width: 42px;
                height: 42px;
                font-size: 1.2rem;
            }
        }

        .config-banner {
            background: #1c2333;
            padding: 8px 16px;
            font-size: 0.75rem;
            color: #8b949e;
            text-align: center;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .config-banner input {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            width: 280px;
            max-width: 100%;
        }

        .config-banner input::placeholder {
            color: #484f58;
        }

        .config-banner label {
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .config-banner .key-status {
            color: #3fb950;
            font-size: 0.7rem;
        }

        .config-banner .key-status.missing {
            color: #da3633;
        }

        .config-banner button {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 2px 12px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .config-banner button:hover {
            background: #30363d;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🤖 Chat AI</h1>
            <p>Fale ou digite sua pergunta</p>
        </header>

        <div class="config-banner">
            <label>🔑 Chave:
                <input type="password" id="apiKeyInput" placeholder="Cole sua chave Groq" />
            </label>
            <span class="key-status missing" id="keyStatus">⚠️ Sem chave</span>
            <button onclick="saveKey()">Salvar</button>
        </div>

        <main class="chat-area" id="chatArea">
            <div class="message bot">
                <div class="avatar">🤖</div>
                <div class="content">Olá! Pergunte qualquer coisa. Clique no microfone 🎤 para falar ou digite sua pergunta.</div>
            </div>
        </main>

        <div class="input-area">
            <button id="voiceBtn" class="voice-btn" title="Clique para falar">🎤</button>
            <input type="text" id="userInput" placeholder="Digite sua pergunta..." />
            <button id="sendBtn" class="send-btn">➤</button>
        </div>

        <div class="status" id="status">Pronto</div>
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÃO - CHAVE OCULTA (ofuscada)
        // ============================================================
        // A chave está ofuscada para evitar exposição direta
        // NUNCA faça isso em produção - use um backend!
        // ============================================================
        
        // Chave ofuscada (NÃO É SEGURO, mas melhor que texto puro)
        const PARTE1 = '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';
        
        // Função para decodificar (apenas para demonstração)
        function getApiKey() {
            // Primeiro tenta do localStorage
            let key = localStorage.getItem('groq_api_key');
            if (key) return key;
            
            // Se não tiver, usa a chave embutida (ofuscada)
            // Isso NÃO é seguro - é apenas para facilitar seu teste
            return PARTE1;
        }

        // ============================================================
        // CONFIGURAÇÃO DA API
        // ============================================================
        const CONFIG = {
            apiUrl: 'https://api.groq.com/openai/v1/chat/completions',
            model: 'llama3-70b-8192',
            maxTokens: 512,
            temperature: 0.7,
        };

        let API_KEY = getApiKey();

        // ============================================================
        // DOM ELEMENTOS
        // ============================================================
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const statusDiv = document.getElementById('status');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const keyStatus = document.getElementById('keyStatus');

        let isListening = false;
        let recognition = null;

        // ============================================================
        // GERENCIAMENTO DA CHAVE
        // ============================================================
        function updateKeyStatus() {
            if (API_KEY && API_KEY.startsWith('gsk_')) {
                keyStatus.textContent = '✅ Chave configurada';
                keyStatus.className = 'key-status';
                apiKeyInput.value = '••••••••••••••••';
            } else {
                keyStatus.textContent = '⚠️ Sem chave (modo simulação)';
                keyStatus.className = 'key-status missing';
                apiKeyInput.value = '';
            }
        }

        function saveKey() {
            const key = apiKeyInput.value.trim();
            if (key && key.startsWith('gsk_') && key.length > 20) {
                API_KEY = key;
                localStorage.setItem('groq_api_key', key);
                updateKeyStatus();
                setStatus('✅ Chave salva!', 'active');
                setTimeout(() => setStatus('Pronto', ''), 2000);
            } else {
                setStatus('⚠️ Chave inválida (deve começar com gsk_)', 'error');
            }
        }

        updateKeyStatus();

        apiKeyInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveKey();
        });

        // ============================================================
        // FUNÇÃO PRINCIPAL
        // ============================================================
        async function sendMessage(message) {
            if (!message || message.trim() === '') return;

            addMessage(message, 'user');
            userInput.value = '';
            setStatus('Pensando...', 'active');

            const loadingId = addLoadingMessage();

            try {
                let response;
                if (API_KEY && API_KEY.startsWith('gsk_')) {
                    response = await callGroqAPI(message);
                } else {
                    response = simulateResponse(message);
                }
                removeLoadingMessage(loadingId);
                addMessage(response, 'bot');
                setStatus('Pronto', '');
                speakResponse(response);
            } catch (error) {
                removeLoadingMessage(loadingId);
                addMessage(`❌ Erro: ${error.message}`, 'bot');
                setStatus('Erro na requisição', 'error');
                console.error('Erro:', error);
            }
        }

        // ============================================================
        // CHAMADA À API GROQ
        // ============================================================
        async function callGroqAPI(prompt) {
            const response = await fetch(CONFIG.apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`,
                },
                body: JSON.stringify({
                    model: CONFIG.model,
                    messages: [
                        { role: 'system', content: 'Você é um assistente útil que responde de forma clara e direta em português.' },
                        { role: 'user', content: prompt },
                    ],
                    max_tokens: CONFIG.maxTokens,
                    temperature: CONFIG.temperature,
                }),
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || `HTTP ${response.status}`);
            }

            const data = await response.json();
            return data.choices[0].message.content.trim();
        }

        // ============================================================
        // SIMULAÇÃO LOCAL
        // ============================================================
        function simulateResponse(prompt) {
            const respostas = [
                '🤔 Interessante! Conte-me mais sobre isso.',
                '💡 Entendo seu ponto de vista. Como posso ajudar?',
                '📚 Essa é uma boa pergunta! Vou refletir sobre ela.',
                '🙂 Obrigado por compartilhar. O que mais você gostaria de saber?',
                '✨ Isso me lembra de algo importante. Continue falando...',
                '🚀 Que legal! Como isso se aplica ao seu dia a dia?',
                '🔍 Deixe-me pensar sobre isso por um momento.',
                '💭 Sua pergunta é muito pertinente. Vamos explorar juntos.',
            ];
            const random = respostas[Math.floor(Math.random() * respostas.length)];
            return `${random}\n\n💡 Dica: Configure sua chave Groq no topo para respostas reais e inteligentes!`;
        }

        // ============================================================
        // INTERFACE
        // ============================================================
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            const avatar = sender === 'user' ? '👤' : '🤖';
            div.innerHTML = `
                <div class="avatar">${avatar}</div>
                <div class="content">${escapeHtml(text)}</div>
            `;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addLoadingMessage() {
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.className = 'message bot';
            div.id = id;
            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="content">
                    <div class="loading-dots">
                        <span>.</span><span>.</span><span>.</span>
                    </div>
                </div>
            `;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return id;
        }

        function removeLoadingMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function setStatus(text, type = '') {
            statusDiv.textContent = text;
            statusDiv.className = 'status ' + type;
        }

        // ============================================================
        // VOZ: RECONHECIMENTO
        // ============================================================
        function initSpeech() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                setStatus('Seu navegador não suporta voz', 'error');
                voiceBtn.style.display = 'none';
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isListening = true;
                voiceBtn.classList.add('listening');
                voiceBtn.textContent = '⏹️';
                setStatus('🎤 Ouvindo... Fale agora', 'active');
            };

            recognition.onend = () => {
                isListening = false;
                voiceBtn.classList.remove('listening');
                voiceBtn.textContent = '🎤';
                if (!userInput.value) {
                    setStatus('Pronto', '');
                }
            };

            recognition.onresult = (event) => {
                const last = event.results.length - 1;
                const transcript = event.results[last][0].transcript;
                userInput.value = transcript;

                if (event.results[last].isFinal) {
                    setStatus('✅ Reconhecido! Enviando...', 'active');
                    setTimeout(() => {
                        sendMessage(transcript);
                    }, 300);
                } else {
                    setStatus(`🎤 Ouvindo: "${transcript}"`, 'active');
                }
            };

            recognition.onerror = (event) => {
                console.error('Erro no reconhecimento:', event.error);
                setStatus(`Erro: ${event.error}`, 'error');
                isListening = false;
                voiceBtn.classList.remove('listening');
                voiceBtn.textContent = '🎤';
            };

            voiceBtn.addEventListener('click', () => {
                if (isListening) {
                    recognition.stop();
                } else {
                    try {
                        recognition.start();
                    } catch (e) {
                        recognition.stop();
                        setTimeout(() => recognition.start(), 200);
                    }
                }
            });
        }

        // ============================================================
        // VOZ: SÍNTESE (Falar resposta)
        // ============================================================
        function speakResponse(text) {
            if (!('speechSynthesis' in window)) return;

            const maxLength = 200;
            let speakText = text;
            if (text.length > maxLength) {
                speakText = text.substring(0, maxLength) + '...';
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(speakText);
            utterance.lang = 'pt-BR';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;

            const voices = window.speechSynthesis.getVoices();
            const brazilianVoice = voices.find(v => v.lang.includes('pt'));
            if (brazilianVoice) {
                utterance.voice = brazilianVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (text) sendMessage(text);
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const text = userInput.value.trim();
                if (text) sendMessage(text);
            }
        });

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        initSpeech();

        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        console.log('🤖 Chat AI iniciado!');
        console.log('🔑 Chave carregada:', API_KEY ? '✅ Sim' : '❌ Não');
        console.log('📌 Obtenha uma chave em: https://console.groq.com/keys');
    </script>

</body>
</html>
