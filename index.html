<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S</title>
    <style>
        /* ============================================================
           RESET E CONFIGURAÇÃO GLOBAL
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ============================================================
           CONTAINER PRINCIPAL
           ============================================================ */
        .container {
            background: #0d0d0d;
            border-radius: 24px;
            padding: 35px 40px 30px;
            max-width: 780px;
            width: 100%;
            border: 1px solid #1a1a1a;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.9), inset 0 0 80px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4fc3f7, transparent);
            opacity: 0.4;
            border-radius: 2px;
        }

        /* ============================================================
           CABEÇALHO
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 14px;
            border-bottom: 1px solid #141414;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 1.4rem;
            color: #4fc3f7;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            color: #e0e0e0;
            letter-spacing: 4px;
        }

        .logo-text span {
            color: #4fc3f7;
            font-weight: 300;
        }

        .status-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.55rem;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
            color: #333;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }
        .status-dot.online { background: #4fc3f7; box-shadow: 0 0 15px rgba(79, 195, 247, 0.4); }
        .status-dot.offline { background: #ff3333; box-shadow: 0 0 15px rgba(255, 51, 51, 0.3); }
        .status-dot.processing { background: #4fc3f7; box-shadow: 0 0 30px rgba(79, 195, 247, 0.6); animation: dot-pulse 0.8s infinite; }

        @keyframes dot-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.5); }
        }

        .status-text {
            color: #555;
            font-size: 0.5rem;
        }

        .model-badge {
            background: #111;
            padding: 3px 12px;
            border-radius: 12px;
            color: #444;
            font-size: 0.5rem;
            letter-spacing: 1px;
            border: 1px solid #1a1a1a;
        }

        /* ============================================================
           ESFERA - AZUL VIBRANTE E VISÍVEL
           ============================================================ */
        .sphere-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px auto 25px;
            position: relative;
        }

        .sphere {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(79, 195, 247, 0.25), rgba(30, 100, 200, 0.1));
            box-shadow:
                0 0 60px rgba(79, 195, 247, 0.15),
                0 0 120px rgba(79, 195, 247, 0.05),
                inset 0 -30px 60px rgba(0, 0, 0, 0.6),
                inset 0 20px 40px rgba(79, 195, 247, 0.1);
            position: relative;
            transition: all 0.6s ease;
            border: 2px solid rgba(79, 195, 247, 0.3);
        }

        /* Líquido interno - azul vibrante */
        .sphere-liquid {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 30% 30%, rgba(79, 195, 247, 0.15), rgba(30, 100, 200, 0.05));
        }

        .sphere-liquid::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background:
                radial-gradient(circle at 30% 40%, rgba(79, 195, 247, 0.2), transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(50, 150, 255, 0.15), transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(100, 200, 255, 0.1), transparent 30%);
            animation: liquid-move 10s ease-in-out infinite alternate;
        }

        .sphere-liquid::after {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(circle at 60% 20%, rgba(79, 195, 247, 0.1), transparent 40%);
            animation: liquid-move-alt 7s ease-in-out infinite alternate;
        }

        @keyframes liquid-move {
            0% { transform: translate(-10%, -5%) rotate(0deg) scale(1); }
            50% { transform: translate(10%, 5%) rotate(3deg) scale(1.02); }
            100% { transform: translate(-5%, 10%) rotate(-3deg) scale(0.98); }
        }

        @keyframes liquid-move-alt {
            0% { transform: translate(-5%, 10%) rotate(0deg) scale(1); }
            100% { transform: translate(10%, -10%) rotate(-5deg) scale(1.05); }
        }

        /* Brilho superior */
        .sphere-shine {
            position: absolute;
            top: 8%;
            left: 18%;
            width: 35%;
            height: 20%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.15), transparent 70%);
            border-radius: 50%;
            transform: rotate(-30deg);
            pointer-events: none;
            filter: blur(2px);
        }

        /* Anéis orbitais - azul visível */
        .sphere-rings {
            position: absolute;
            width: 190px;
            height: 190px;
            top: -20px;
            left: -20px;
            pointer-events: none;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: ring-rotate 25s linear infinite;
        }

        .ring:nth-child(1) {
            animation-duration: 18s;
            border: 1px solid rgba(79, 195, 247, 0.15);
        }
        .ring:nth-child(2) {
            width: 210px;
            height: 210px;
            top: -30px;
            left: -30px;
            animation-duration: 28s;
            animation-direction: reverse;
            border: 1px solid rgba(79, 195, 247, 0.08);
        }
        .ring:nth-child(3) {
            width: 170px;
            height: 170px;
            top: -10px;
            left: -10px;
            animation-duration: 22s;
            border: 1px dashed rgba(79, 195, 247, 0.06);
        }

        @keyframes ring-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Estado ATIVO - brilho intenso */
        .sphere.active {
            box-shadow:
                0 0 80px rgba(79, 195, 247, 0.3),
                0 0 160px rgba(79, 195, 247, 0.1),
                inset 0 0 60px rgba(79, 195, 247, 0.1);
            border-color: rgba(79, 195, 247, 0.6);
            animation: sphere-pulse 1.5s ease-in-out infinite;
        }

        .sphere.active .sphere-liquid::before {
            animation-duration: 2s;
            animation-timing-function: ease-in-out;
        }

        @keyframes sphere-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* ============================================================
           CHAT BOX
           ============================================================ */
        .chat-box {
            background: #080808;
            border-radius: 16px;
            padding: 18px 20px;
            min-height: 260px;
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 18px;
            border: 1px solid #111;
        }

        .chat-box::-webkit-scrollbar { width: 3px; }
        .chat-box::-webkit-scrollbar-track { background: #0a0a0a; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(79, 195, 247, 0.2); border-radius: 10px; }

        .message {
            display: flex;
            margin-bottom: 12px;
            animation: msg-fade 0.3s ease;
        }
        .message.user { justify-content: flex-end; }
        .message.bot { justify-content: flex-start; }

        @keyframes msg-fade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble {
            max-width: 80%;
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 0.85rem;
            line-height: 1.6;
            word-wrap: break-word;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .user .bubble {
            background: #121212;
            color: #ccc;
            border-bottom-right-radius: 3px;
            border: 1px solid #1a1a1a;
        }

        .bot .bubble {
            background: #0a0a0a;
            color: #aaa;
            border-bottom-left-radius: 3px;
            border: 1px solid #111;
        }

        .bot .bubble .timestamp {
            font-size: 0.5rem;
            color: #222;
            display: block;
            margin-top: 4px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           TYPING INDICATOR
           ============================================================ */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 0;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(79, 195, 247, 0.3);
            animation: typing-bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing-bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.2; }
            30% { transform: translateY(-6px); opacity: 0.8; }
        }

        /* ============================================================
           INPUT AREA
           ============================================================ */
        .input-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            min-width: 140px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 25px;
            border: 1px solid #141414;
            background: #080808;
            color: #aaa;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 300;
        }

        .input-wrapper input::placeholder {
            color: #222;
            font-family: 'Orbitron', monospace;
            font-size: 0.55rem;
            letter-spacing: 1px;
        }

        .input-wrapper input:focus {
            border-color: rgba(79, 195, 247, 0.15);
            background: #0a0a0a;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 25px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0d0d0d;
            color: #333;
            border: 1px solid #141414;
        }

        .btn-primary {
            background: #0d0d0d;
            color: #666;
            border: 1px solid #1a1a1a;
        }

        .btn-primary:hover {
            background: #111;
            color: #4fc3f7;
            border-color: rgba(79, 195, 247, 0.15);
        }

        .btn-primary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-mic {
            background: #0a0a0a;
            color: #333;
            border: 1px solid #141414;
            padding: 14px 18px;
            font-size: 1rem;
        }

        .btn-mic:hover {
            background: #0f0f0f;
            border-color: rgba(79, 195, 247, 0.1);
        }

        .btn-mic.listening {
            background: #0a0a0a;
            border-color: #4fc3f7;
            color: #4fc3f7;
            animation: mic-pulse 1s infinite;
        }

        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(79, 195, 247, 0.1); }
            50% { box-shadow: 0 0 0 12px rgba(79, 195, 247, 0); }
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            margin-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.45rem;
            font-family: 'Orbitron', monospace;
            color: #1a1a1a;
            letter-spacing: 0.5px;
        }

        .footer .stats span {
            color: #222;
            margin: 0 3px;
        }

        .footer .stats .highlight {
            color: #4fc3f7;
            opacity: 0.6;
        }

        /* ============================================================
           RESPONSIVIDADE
           ============================================================ */
        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .sphere { width: 120px; height: 120px; }
            .sphere-rings { width: 150px; height: 150px; top: -15px; left: -15px; }
            .ring:nth-child(2) { width: 170px; height: 170px; top: -25px; left: -25px; }
            .ring:nth-child(3) { width: 135px; height: 135px; top: -7px; left: -7px; }
            .logo-text { font-size: 0.9rem; letter-spacing: 2px; }
            .chat-box { min-height: 180px; max-height: 250px; padding: 14px; }
            .btn { padding: 12px 16px; font-size: 0.55rem; }
            .header { flex-wrap: wrap; gap: 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- CABEÇALHO -->
    <div class="header">
        <div class="logo-area">
            <span class="logo-icon">◆</span>
            <span class="logo-text">J.A.R.V.I.S</span>
        </div>
        <div class="status-area">
            <span class="status-dot online" id="statusDot"></span>
            <span class="status-text" id="statusText">ONLINE</span>
            <span class="model-badge" id="modelBadge">GPT-3.5</span>
        </div>
    </div>

    <!-- ESFERA -->
    <div class="sphere-container">
        <div class="sphere" id="sphere">
            <div class="sphere-liquid"></div>
            <div class="sphere-shine"></div>
            <div class="sphere-rings">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
            </div>
        </div>
    </div>

    <!-- CHAT -->
    <div class="chat-box" id="chatBox">
        <div class="message bot">
            <div class="bubble">
                Sistema J.A.R.V.I.S ativado.
                <span class="timestamp">● INICIALIZADO</span>
            </div>
        </div>
    </div>

    <!-- INPUT -->
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="DIGITE SUA MENSAGEM..." />
        </div>
        <button class="btn btn-primary" id="sendBtn">→</button>
        <button class="btn btn-mic" id="micBtn">🎙</button>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <div class="stats">
            <span>●</span> <span class="highlight">200</span> / DIA
        </div>
        <div class="stats">
            <span>●</span> CHATANYWHERE
        </div>
    </div>
</div>

<script>
// ============================================================
// CONFIGURAÇÃO DA API
// ============================================================
const API_KEY = "sk-hvnrnWWAFZQDygNaqXgT7vzaoAvdcIHeqopGanhZcaC80pxP";
const BASE_URL = "https://api.chatanywhere.tech/v1";
const MODEL = "gpt-3.5-turbo";

// ============================================================
// CONFIGURAÇÃO DE VOZ - MAIS GROSSA E RÁPIDA
// ============================================================
const SPEECH_RATE = 1.6;
const SPEECH_PITCH = 0.6;
const SPEECH_VOLUME = 1;

// ============================================================
// ELEMENTOS DOM
// ============================================================
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const modelBadge = document.getElementById('modelBadge');
const sphere = document.getElementById('sphere');

modelBadge.textContent = MODEL.toUpperCase();

let isListening = false;
let recognition = null;
let isProcessing = false;
let currentUtterance = null;

// ============================================================
// FUNÇÕES DA ESFERA
// ============================================================
function setSphereState(state) {
    sphere.classList.remove('active');
    if (state === 'active') {
        sphere.classList.add('active');
    }
}

function setStatus(state, text) {
    statusDot.className = `status-dot ${state}`;
    statusText.textContent = text.toUpperCase();
    if (state === 'processing') {
        setSphereState('active');
    } else {
        setSphereState('idle');
    }
}

// ============================================================
// MENSAGENS
// ============================================================
function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (sender === 'bot') {
        const timestamp = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        bubble.innerHTML = `${text}<span class="timestamp">● ${timestamp}</span>`;
    } else {
        bubble.textContent = text;
    }

    div.appendChild(bubble);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// ============================================================
// TYPING INDICATOR
// ============================================================
function showTyping() {
    const div = document.createElement('div');
    div.className = 'message bot';
    div.id = 'typingIndicator';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = `
        <div class="typing-indicator">
            <span></span><span></span><span></span>
        </div>
    `;
    div.appendChild(bubble);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

// ============================================================
// TEXTO-TO-SPEECH - MAIS GROSSO E RÁPIDO
// ============================================================
function speakText(text) {
    if (!('speechSynthesis' in window)) return;

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'pt-BR';
    utterance.rate = SPEECH_RATE;
    utterance.pitch = SPEECH_PITCH;
    utterance.volume = SPEECH_VOLUME;

    const voices = window.speechSynthesis.getVoices();
    const preferredVoices = voices.filter(v => v.lang.startsWith('pt'));
    if (preferredVoices.length > 0) {
        utterance.voice = preferredVoices[0];
    }

    utterance.onstart = () => {
        setSphereState('active');
        setStatus('processing', 'Falando...');
    };
    utterance.onend = () => {
        setSphereState('idle');
        if (!isProcessing) {
            setStatus('online', 'Online');
        }
    };
    utterance.onerror = () => {
        setSphereState('idle');
        if (!isProcessing) {
            setStatus('online', 'Online');
        }
    };

    currentUtterance = utterance;
    window.speechSynthesis.speak(utterance);
}

// ============================================================
// CHAMADA À API
// ============================================================
async function sendMessageToAI(userMessage) {
    if (isProcessing) return;
    isProcessing = true;
    sendBtn.disabled = true;

    try {
        showTyping();
        setStatus('processing', 'Processando...');

        const response = await fetch(`${BASE_URL}/chat/completions`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: MODEL,
                messages: [
                    { role: 'system', content: 'Você é o JARVIS, assistente pessoal. Seja direto, objetivo e formal. Responda em português.' },
                    { role: 'user', content: userMessage }
                ],
                max_tokens: 500,
                temperature: 0.7
            })
        });

        hideTyping();

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(`Erro ${response.status}: ${errorData.error?.message || response.statusText}`);
        }

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || 'Desculpe, não consegui gerar uma resposta.';

        addMessage(reply, 'bot');
        setStatus('online', 'Online');
        speakText(reply);

    } catch (error) {
        hideTyping();
        addMessage(`⚠️ ${error.message}`, 'bot');
        setStatus('offline', 'Erro');
        console.error('Erro na API:', error);
    } finally {
        isProcessing = false;
        sendBtn.disabled = false;
    }
}

// ============================================================
// ENVIO DE MENSAGEM
// ============================================================
function handleSend() {
    const text = userInput.value.trim();
    if (!text || isProcessing) return;

    addMessage(text, 'user');
    userInput.value = '';
    userInput.focus();
    sendMessageToAI(text);
}

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSend();
});

// ============================================================
// MICROFONE
// ============================================================
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        micBtn.textContent = '⏹';
        setStatus('processing', 'Ouvindo...');
    };

    recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎙';
        if (statusText.textContent === 'OUVINDO...') {
            setStatus('online', 'Online');
        }
    };

    recognition.onerror = (event) => {
        console.warn('Erro no microfone:', event.error);
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎙';
        setStatus('online', 'Online');
        if (event.error === 'not-allowed') {
            addMessage('⚠️ Permita o acesso ao microfone.', 'bot');
        }
    };

    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        setTimeout(() => handleSend(), 300);
    };

    micBtn.addEventListener('click', () => {
        if (isListening) {
            recognition.stop();
            return;
        }
        try {
            recognition.start();
        } catch (e) {
            console.warn('Erro ao iniciar microfone:', e);
        }
    });

} else {
    micBtn.style.display = 'none';
}

// ============================================================
// CARREGA VOZES DISPONÍVEIS
// ============================================================
if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
    };
}

// ============================================================
// TESTE DE CONEXÃO
// ============================================================
async function testConnection() {
    try {
        const response = await fetch(`${BASE_URL}/models`, {
            headers: { 'Authorization': `Bearer ${API_KEY}` }
        });
        if (response.ok) {
            setStatus('online', 'Online');
            console.log('✅ API Key válida!');
        } else {
            setStatus('offline', 'Falha na chave');
            console.warn('⚠️ Verifique sua API Key');
        }
    } catch (e) {
        setStatus('offline', 'Sem conexão');
        console.warn('⚠️ Não foi possível conectar');
    }
}
testConnection();

console.log('🚀 J.A.R.V.I.S iniciado');
console.log(`📦 Modelo: ${MODEL} | Velocidade: ${SPEECH_RATE}x | Tom: ${SPEECH_PITCH}`);
</script>
