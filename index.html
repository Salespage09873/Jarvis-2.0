<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. - Deep Voice Protocol</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: rgba(5, 10, 5, 0.9);
            --primary-color: #001100;
            --highlight-color: #00ff41;
            --text-color: #ccffcc;
            --border-color: #003300;
            --alert-color: #ff3333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Efeito de Scanline */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 2px solid var(--highlight-color);
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0, 255, 65, 0.1);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--highlight-color);
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 15px var(--highlight-color);
            font-weight: 900;
        }

        .chat-area {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--highlight-color);
            border-radius: 5px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 15px;
            box-shadow: inset 0 0 50px rgba(0, 255, 65, 0.05);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 4px;
            font-size: 1.1rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
            border-left: 4px solid var(--highlight-color);
            background: linear-gradient(90deg, rgba(0, 50, 0, 0.4), transparent);
            color: #fff;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        .message.user {
            align-self: flex-end;
            border-right: 4px solid #008f11;
            background: rgba(0, 30, 0, 0.6);
            color: #e0ffe0;
            text-align: right;
        }

        .input-group {
            display: flex;
            gap: 10px;
            background: var(--panel-bg);
            padding: 10px;
            border: 1px solid var(--highlight-color);
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.1);
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border-color);
            color: var(--highlight-color);
            padding: 15px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 2px;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--highlight-color);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
        }

        button {
            background: rgba(0, 50, 0, 0.8);
            border: 1px solid var(--highlight-color);
            color: var(--highlight-color);
            padding: 0 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 2px;
            text-transform: uppercase;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        button:hover {
            background: var(--highlight-color);
            color: #000;
            box-shadow: 0 0 20px var(--highlight-color);
        }

        button:active {
            transform: scale(0.95);
        }

        button.mic-active {
            background: #300;
            border-color: var(--alert-color);
            color: var(--alert-color);
            animation: pulseRed 1s infinite;
        }

        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(255, 50, 50, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 50, 50, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 50, 50, 0); }
        }

        .status-bar {
            font-size: 0.9rem;
            color: var(--highlight-color);
            text-align: center;
            margin-top: 10px;
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 5px var(--highlight-color);
            letter-spacing: 2px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; border-left: 1px solid var(--border-color); }
        ::-webkit-scrollbar-thumb { background: var(--highlight-color); }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .container { padding: 10px; }
            .input-group { flex-direction: column; }
            button { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>J.A.R.V.I.S. <span style="font-size:0.4em; vertical-align: middle; opacity: 0.8;">DEEP CORE</span></h1>
    </header>

    <div class="chat-area" id="chatBox">
        <div class="message bot">
            SISTEMA DE ÁUDIO PROFUNDO ATIVADO. PRONTO PARA COMANDOS, SENHOR.
        </div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="DIGITE O COMANDO..." autocomplete="off">
        <button id="sendBtn">ENVIAR</button>
        <button id="micBtn">🎙️</button>
    </div>

    <div class="status-bar" id="statusText">AGUARDANDO INPUT...</div>
</div>

<script>
    // CONFIGURAÇÃO DA API
    const API_KEY = "sk-hvnrnWWAFZQDygNaqXgT7vzaoAvdcIHeqopGanhZcaC80pxP";
    const BASE_URL = "https://api.chatanywhere.tech/v1";
    const MODEL = "gpt-3.5-turbo";

    // ELEMENTOS
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');

    let isListening = false;
    let recognition = null;

    // ============================================================
    // MOTOR DE ÁUDIO PROFUNDO (WEB AUDIO API)
    // Isso cria o efeito de voz grossa artificialmente
    // ============================================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    async function speakDeep(text) {
        if (!window.speechSynthesis) return;
        
        // Cancela falas anteriores
        window.speechSynthesis.cancel();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        const utterance = new SpeechSynthesisUtterance(text);
        
        // Configuração base da voz nativa (a mais grave possível)
        utterance.pitch = 0.01; // Mínimo absoluto
        utterance.rate = 1.1;   // Velocidade normal para não distorcer o efeito de áudio
        utterance.volume = 1.0;
        utterance.lang = 'pt-BR';

        // Selecionar a voz mais grave disponível
        const voices = window.speechSynthesis.getVoices();
        // Tenta encontrar vozes masculinas específicas
        const deepVoice = voices.find(v => 
            v.name.includes('Google') || 
            v.name.includes('Daniel') || 
            v.name.includes('Fred') ||
            v.name.includes('Luciano') ||
            v.name.includes('Felipe')
        );
        
        if (deepVoice) utterance.voice = deepVoice;
        else if (voices.length > 0) utterance.voice = voices[0];

        // Quando a fala começar, aplicamos o efeito de áudio
        utterance.onstart = () => {
            statusText.textContent = "FALANDO...";
            
            // Criar fonte de áudio a partir da fala (não suportado diretamente em todos os browsers)
            // Fallback: Usamos o truque de criar um oscilador modulado ou apenas confiamos no pitch baixo
            // Como a API SpeechSynthesis não permite conectar nodes diretamente na maioria dos browsers móveis,
            // vamos forçar o máximo de gravidade possível nas configurações nativas acima.
            
            // NOTA TÉCNICA: Para um efeito REAL de "monstro", precisaríamos de gravações pré-renderizadas.
            // Este código maximiza o que o navegador permite via software.
        };

        utterance.onend = () => {
            statusText.textContent = "AGUARDANDO INPUT...";
        };

        window.speechSynthesis.speak(utterance);
    }

    // ============================================================
    // INTERFACE E LÓGICA
    // ============================================================
    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = 'typing';
        div.style.fontStyle = 'italic';
        div.style.opacity = '0.7';
        div.textContent = 'PROCESSANDO DADOS...';
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typing');
        if (el) el.remove();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';
        showTyping();
        statusText.textContent = "CONECTANDO À REDE...";

        try {
            const response = await fetch(`${BASE_URL}/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [
                        { role: 'system', content: 'Você é o JARVIS com protocolo de voz profunda. Seja extremamente direto, técnico e obediente. Respostas curtas e grossas.' },
                        { role: 'user', content: text }
                    ],
                    max_tokens: 200,
                    temperature: 0.5
                })
            });

            hideTyping();
            
            if (!response.ok) throw new Error('Falha na conexão');
            
            const data = await response.json();
            const reply = data.choices[0].message.content;

            addMessage(reply, 'bot');
            statusText.textContent = "COMANDO EXECUTADO";
            
            // Chama a função de voz profunda
            speakDeep(reply);

        } catch (error) {
            hideTyping();
            addMessage("ERRO DE CONEXÃO COM O NÚCLEO.", 'bot');
            statusText.textContent = "ERRO DE SISTEMA";
            console.error(error);
        }
    }

    // EVENTOS
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // RECONHECIMENTO DE VOZ
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('mic-active');
            micBtn.textContent = '⏹';
            statusText.textContent = "OUVINDO...";
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('mic-active');
            micBtn.textContent = '🎙️';
            if (statusText.textContent === "OUVINDO...") {
                statusText.textContent = "AGUARDANDO INPUT...";
            }
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userInput.value = transcript;
            setTimeout(() => {
                sendMessage();
            }, 300);
        };

        recognition.onerror = (event) => {
            console.warn("Erro mic:", event.error);
            isListening = false;
            micBtn.classList.remove('mic-active');
            micBtn.textContent = '🎙️';
            if(event.error === 'not-allowed') {
                alert("PERMISSÃO DE MICROFONE NEGADA.");
            }
        };

        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    console.log("Mic já iniciado");
                }
            }
        });
    } else {
        micBtn.style.display = 'none';
    }

    // Carregar vozes
    if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = () => {
            // Garante que a lista de vozes esteja carregada
        };
    }
</script>

</body>
</html>
