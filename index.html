<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. - Sistema Operacional</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00ffff;
            --secondary-color: #00ff88;
            --bg-color: #050505;
            --panel-bg: rgba(0, 20, 20, 0.6);
            --text-glow: 0 0 10px rgba(0, 255, 255, 0.5);
            --border-glow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 50, 50, 0.2) 0%, transparent 70%),
                linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.8) 0%, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--primary-color);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            text-align: center;
            padding: 15px;
            border-bottom: 2px solid var(--primary-color);
            box-shadow: var(--border-glow);
            background: rgba(0,0,0,0.8);
            z-index: 10;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: var(--text-glow);
            animation: pulseText 3s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* Main Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow: hidden;
            position: relative;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
        }

        /* Scrollbar customizada */
        .chat-history::-webkit-scrollbar {
            width: 6px;
        }
        .chat-history::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.5);
        }
        .chat-history::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 18px;
            border-radius: 4px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 1.1rem;
            line-height: 1.4;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: rgba(0, 100, 100, 0.2);
            border: 1px solid var(--primary-color);
            border-right: 4px solid var(--primary-color);
            color: #e0ffff;
            margin-left: auto;
            border-radius: 4px 0 4px 4px;
        }

        .jarvis-message {
            align-self: flex-start;
            background: rgba(0, 30, 30, 0.4);
            border: 1px solid var(--secondary-color);
            border-left: 4px solid var(--secondary-color);
            color: var(--secondary-color);
            margin-right: auto;
            border-radius: 0 4px 4px 4px;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: rgba(0,0,0,0.9);
            border-top: 1px solid var(--primary-color);
            align-items: center;
        }

        #command-input {
            flex: 1;
            padding: 15px;
            background: rgba(0, 20, 20, 0.5);
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }

        #command-input:focus {
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            background: rgba(0, 30, 30, 0.8);
        }

        button {
            padding: 15px 20px;
            background: rgba(0, 100, 100, 0.3);
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            color: var(--primary-color);
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
        }

        button:active {
            transform: scale(0.95);
            background: rgba(0, 255, 255, 0.2);
        }

        button.listening {
            background: rgba(255, 0, 0, 0.3);
            border-color: #ff3333;
            color: #ff3333;
            animation: pulseRed 1s infinite;
        }

        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 5px 15px;
            font-size: 0.8rem;
            color: #008888;
            background: rgba(0,0,0,0.8);
            border-top: 1px solid #003333;
        }

        .typing-indicator {
            color: var(--secondary-color);
            font-style: italic;
            font-size: 0.9rem;
            padding: 5px 15px;
            display: none;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; letter-spacing: 2px; }
            .message { font-size: 1rem; max-width: 90%; }
            button { padding: 12px 15px; }
            #command-input { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>J.A.R.V.I.S.</h1>
    </header>

    <div class="status-bar">
        <span id="connection-status">SISTEMA: ONLINE</span>
        <span id="model-status">MODELO: ATIVO</span>
    </div>

    <div class="chat-container">
        <div class="chat-history" id="chat-history">
            <div class="message jarvis-message">
                Sistemas iniciados. Olá, senhor. Estou pronto para operar. Como posso auxiliar?
            </div>
        </div>
        <div class="typing-indicator" id="typing-indicator">
            PROCESSANDO DADOS...
        </div>
    </div>

    <div class="input-area">
        <button id="voice-btn" title="Ativar Voz">🎤</button>
        <input type="text" id="command-input" placeholder="Digite seu comando ou fale..." autocomplete="off">
        <button id="send-btn">ENVIAR</button>
    </div>

    <script>
        // CONFIGURAÇÕES DA API
        const API_KEY = "sk-hvnrnWWAFZQDygNaqXgT7vzaoAvdcIHeqopGanhZcaC80pxP";
        const BASE_URL = "https://api.chatanywhere.tech/v1";
        const MODEL = "gpt-3.5-turbo";

        // ELEMENTOS DOM
        const chatHistory = document.getElementById('chat-history');
        const commandInput = document.getElementById('command-input');
        const sendBtn = document.getElementById('send-btn');
        const voiceBtn = document.getElementById('voice-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const connectionStatus = document.getElementById('connection-status');

        // CONFIGURAÇÃO DE VOZ (MAIS RÁPIDA E GROSSA)
        let synth = window.speechSynthesis;
        let voices = [];

        function loadVoices() {
            voices = synth.getVoices();
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function speakText(text) {
            if (synth.speaking) {
                console.error('Já estou falando, senhor.');
                synth.cancel(); // Interrompe fala anterior para começar a nova imediatamente
            }

            const utterThis = new SpeechSynthesisUtterance(text);
            
            // Tenta encontrar uma voz em Português ou Inglês de boa qualidade
            const preferredVoice = voices.find(voice => voice.lang === 'pt-BR') || 
                                   voices.find(voice => voice.lang.includes('pt')) ||
                                   voices.find(voice => voice.lang === 'en-US') ||
                                   voices[0];

            if (preferredVoice) {
                utterThis.voice = preferredVoice;
            }

            // CONFIGURAÇÕES SOLICITADAS
            utterThis.rate = 2.0;   // 100% mais rápido (Máximo recomendado para clareza)
            utterThis.pitch = 0.5;  // Bem grosso (0 é o mínimo, 1 é normal)
            utterThis.volume = 1.0;

            utterThis.onend = function (event) {
                console.log('Fala concluída.');
            };

            utterThis.onerror = function (event) {
                console.error('Erro na síntese de voz:', event.error);
            };

            synth.speak(utterThis);
        }

        // FUNÇÕES DE CHAT
        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.classList.add('message');
            div.classList.add(isUser ? 'user-message' : 'jarvis-message');
            div.textContent = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessageToAI(userMessage) {
            typingIndicator.style.display = 'block';
            connectionStatus.textContent = "PROCESSANDO...";
            connectionStatus.style.color = "#ffff00";

            try {
                const response = await fetch(`${BASE_URL}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [
                            { 
                                role: 'system', 
                                content: 'Você é JARVIS, a IA do Homem de Ferro. Fale de forma direta, técnica, leal e rápida. Chame o usuário de "Senhor". Seja eficiente.' 
                            },
                            { role: 'user', content: userMessage }
                        ],
                        max_tokens: 300,
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    throw new Error(`Erro na conexão: ${response.status}`);
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;

                typingIndicator.style.display = 'none';
                connectionStatus.textContent = "SISTEMA: ONLINE";
                connectionStatus.style.color = "#00ff88";

                addMessage(reply, false);
                speakText(reply); // Fala a resposta

            } catch (error) {
                typingIndicator.style.display = 'none';
                connectionStatus.textContent = "ERRO DE CONEXÃO";
                connectionStatus.style.color = "#ff3333";
                addMessage("Falha na comunicação com o servidor central, senhor.", false);
                console.error(error);
            }
        }

        function handleSend() {
            const text = commandInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            commandInput.value = '';
            
            // Pequeno delay para simular processamento local antes de chamar a API
            setTimeout(() => {
                sendMessageToAI(text);
            }, 300);
        }

        // EVENT LISTENERS
        sendBtn.addEventListener('click', handleSend);
        
        commandInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // RECONHECIMENTO DE VOZ (MICROFONE)
        let recognition;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                voiceBtn.classList.add('listening');
                connectionStatus.textContent = "OUVINDO...";
                connectionStatus.style.color = "#00ffff";
            };

            recognition.onend = () => {
                voiceBtn.classList.remove('listening');
                if(connectionStatus.textContent === "OUVINDO...") {
                    connectionStatus.textContent = "SISTEMA: ONLINE";
                    connectionStatus.style.color = "#00ff88";
                }
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                commandInput.value = transcript;
                handleSend(); // Envia automaticamente após falar
            };

            recognition.onerror = (event) => {
                console.warn('Erro no mic:', event.error);
                voiceBtn.classList.remove('listening');
                if(event.error === 'not-allowed') {
                    alert("Senhor, preciso de permissão para acessar o microfone.");
                }
            };

            voiceBtn.addEventListener('click', () => {
                if (voiceBtn.classList.contains('listening')) {
                    recognition.stop();
                } else {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.log("Já iniciado");
                    }
                }
            });
        } else {
            voiceBtn.style.display = 'none';
            console.log("Navegador não suporta reconhecimento de voz.");
        }

        // Inicialização
        window.onload = () => {
            loadVoices();
            // Tenta carregar vozes novamente após um tempo se estiver vazio
            setTimeout(loadVoices, 500);
        };

    </script>
</body>
</html>
