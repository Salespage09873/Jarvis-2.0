<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. - Tático</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: rgba(10, 15, 10, 0.85);
            --primary-color: #0f380f; /* Verde escuro tático */
            --highlight-color: #00ff41; /* Verde fósforo suave */
            --text-color: #cfc;
            --border-color: #1a4d1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Fundo Grid Sutil */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--primary-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--primary-color) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--highlight-color);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.3);
        }

        .chat-area {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 2px;
            font-size: 1rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .message.bot {
            align-self: flex-start;
            border-left: 3px solid var(--highlight-color);
            background: rgba(0, 50, 0, 0.2);
            color: #e0ffe0;
        }

        .message.user {
            align-self: flex-end;
            border-right: 3px solid #008f11;
            background: rgba(0, 30, 0, 0.4);
            color: #fff;
            text-align: right;
        }

        .input-group {
            display: flex;
            gap: 10px;
            background: var(--panel-bg);
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            color: var(--highlight-color);
            padding: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            outline: none;
            border-radius: 2px;
        }

        input[type="text"]:focus {
            border-color: var(--highlight-color);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.1);
        }

        button {
            background: rgba(0, 50, 0, 0.6);
            border: 1px solid var(--border-color);
            color: var(--highlight-color);
            padding: 0 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        button:active {
            background: var(--highlight-color);
            color: #000;
        }

        button.mic-active {
            background: #300;
            border-color: #f00;
            color: #f00;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        .status-bar {
            font-size: 0.8rem;
            color: #446644;
            text-align: center;
            margin-top: 10px;
            font-family: 'Orbitron', monospace;
        }

        /* Scrollbar personalizada escura */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #1a4d1a; }
        ::-webkit-scrollbar-thumb:hover { background: #00ff41; }

        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; letter-spacing: 2px; }
            .container { padding: 10px; height: 100vh; }
            .chat-area { margin-bottom: 10px; }
            button { padding: 0 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>J.A.R.V.I.S. <span style="font-size:0.5em; vertical-align: middle;">v3.0 TÁTICO</span></h1>
    </header>

    <div class="chat-area" id="chatBox">
        <div class="message bot">
            Sistemas online. Protocolo de voz ajustado para modo tático. Aguardando ordens, senhor.
        </div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="Comando..." autocomplete="off">
        <button id="sendBtn">ENVIAR</button>
        <button id="micBtn">🎙️</button>
    </div>

    <div class="status-bar" id="statusText">AGUARDANDO INPUT...</div>
</div>

<script>
    // CONFIGURAÇÃO DA API
    const API_KEY = "sk-hvnrnWWAFZQDygNaqXgT7vzaoAvdcIHeqopGanhZcaC80pxP";
    const BASE_URL = "https://api.chatanywhere.tech/v1";
    const MODEL = "gpt-3.5-turbo";

    // ELEMENTOS
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');

    let isListening = false;
    let recognition = null;

    // CONFIGURAÇÃO DE VOZ (SUPER GROSSA E RÁPIDA)
    function configureVoice() {
        if (!window.speechSynthesis) return;
        
        const utterance = new SpeechSynthesisUtterance();
        
        // Configurações Extremas Solicitadas
        utterance.rate = 2.2;  // 120% mais rápido que o normal (Máximo seguro)
        utterance.pitch = 0.1; // O mais grave possível
        utterance.volume = 1.0;
        utterance.lang = 'pt-BR';

        // Tentar forçar uma voz masculina/grave específica
        const voices = window.speechSynthesis.getVoices();
        // Prioriza vozes do Google ou Microsoft que tendem a ser mais graves
        const preferredVoice = voices.find(v => 
            v.name.includes('Google') || 
            v.name.includes('Daniel') || 
            v.name.includes('Fred') ||
            v.name.includes('Luciano')
        );

        if (preferredVoice) {
            utterance.voice = preferredVoice;
        } else if (voices.length > 0) {
            // Se não achar a específica, pega a primeira disponível
            utterance.voice = voices[0];
        }

        return utterance;
    }

    function speak(text) {
        if (!window.speechSynthesis) return;
        
        window.speechSynthesis.cancel(); // Para qualquer fala anterior imediatamente
        
        const utterance = configureVoice();
        utterance.text = text;
        
        // Eventos para debug
        utterance.onend = () => {
            statusText.textContent = "AGUARDANDO INPUT...";
        };
        
        window.speechSynthesis.speak(utterance);
    }

    // INTERFACE
    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = 'typing';
        div.style.fontStyle = 'italic';
        div.style.opacity = '0.7';
        div.textContent = 'Processando dados...';
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typing');
        if (el) el.remove();
    }

    // LÓGICA DA API
    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';
        showTyping();
        statusText.textContent = "CONECTANDO À REDE...";

        try {
            const response = await fetch(`${BASE_URL}/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [
                        { role: 'system', content: 'Você é o JARVIS, assistente tático do Homem de Ferro. Seja direto, profissional, levemente sarcástico mas obediente. Responda sempre em português de forma concisa.' },
                        { role: 'user', content: text }
                    ],
                    max_tokens: 300,
                    temperature: 0.7
                })
            });

            hideTyping();
            
            if (!response.ok) throw new Error('Falha na conexão');
            
            const data = await response.json();
            const reply = data.choices[0].message.content;

            addMessage(reply, 'bot');
            statusText.textContent = "COMANDO EXECUTADO";
            
            // Falar a resposta
            speak(reply);

        } catch (error) {
            hideTyping();
            addMessage("Erro de conexão com o servidor central.", 'bot');
            statusText.textContent = "ERRO DE SISTEMA";
            console.error(error);
        }
    }

    // EVENTOS
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // RECONHECIMENTO DE VOZ (MOBILE COMPATIBLE)
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('mic-active');
            micBtn.textContent = '⏹';
            statusText.textContent = "OUVINDO...";
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('mic-active');
            micBtn.textContent = '🎙️';
            if (statusText.textContent === "OUVINDO...") {
                statusText.textContent = "AGUARDANDO INPUT...";
            }
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userInput.value = transcript;
            // Pequeno delay para UX
            setTimeout(() => {
                sendMessage();
            }, 300);
        };

        recognition.onerror = (event) => {
            console.warn("Erro mic:", event.error);
            isListening = false;
            micBtn.classList.remove('mic-active');
            micBtn.textContent = '🎙️';
            if(event.error === 'not-allowed') {
                alert("Permissão de microfone negada. Verifique as configurações do navegador.");
            }
        };

        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    console.log("Mic já iniciado");
                }
            }
        });
    } else {
        micBtn.style.display = 'none';
        console.log("Navegador não suporta voz");
    }

    // Carregar vozes no mobile (às vezes demora)
    if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = () => {
            // Força recarregamento da lista de vozes
            configureVoice();
        };
    }
</script>

</body>
</html>
