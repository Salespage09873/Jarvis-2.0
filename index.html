<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. - PROTOCOLO DEEP</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: rgba(5, 10, 5, 0.9);
            --primary-color: #0a1f0a;
            --highlight-color: #00ff41;
            --text-color: #d0ffd0;
            --border-color: #1a4d1a;
            --alert-color: #ff3333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Efeito de Scanline CRT */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 2px solid var(--highlight-color);
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0, 255, 65, 0.1);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--highlight-color);
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
            font-weight: 900;
        }

        .chat-area {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 15px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        /* Borda brilhante interna */
        .chat-area::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid rgba(0, 255, 65, 0.1);
            pointer-events: none;
        }

        .message {
            max-width: 90%;
            padding: 12px 16px;
            border-radius: 1px;
            font-size: 1.1rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            font-weight: 500;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
            border-left: 4px solid var(--highlight-color);
            background: linear-gradient(90deg, rgba(0, 40, 0, 0.4), transparent);
            color: #fff;
            text-shadow: 0 0 2px rgba(0, 255, 65, 0.5);
        }

        .message.user {
            align-self: flex-end;
            border-right: 4px solid #008f11;
            background: linear-gradient(-90deg, rgba(0, 60, 0, 0.4), transparent);
            color: #e0ffe0;
            text-align: right;
        }

        .input-group {
            display: flex;
            gap: 10px;
            background: var(--panel-bg);
            padding: 12px;
            border: 1px solid var(--highlight-color);
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.15);
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border-color);
            color: var(--highlight-color);
            padding: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            outline: none;
            border-radius: 1px;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            border-color: var(--highlight-color);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }

        button {
            background: rgba(0, 40, 0, 0.8);
            border: 1px solid var(--highlight-color);
            color: var(--highlight-color);
            padding: 0 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.1s;
            border-radius: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        button:active {
            background: var(--highlight-color);
            color: #000;
            transform: scale(0.98);
        }

        button.mic-active {
            background: #300;
            border-color: var(--alert-color);
            color: var(--alert-color);
            box-shadow: 0 0 15px var(--alert-color);
            animation: pulse-red 0.8s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }

        .status-bar {
            font-size: 0.75rem;
            color: #446644;
            text-align: center;
            margin-top: 10px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #1a4d1a; }
        ::-webkit-scrollbar-thumb:hover { background: var(--highlight-color); }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; letter-spacing: 3px; }
            .container { padding: 10px; }
            .message { font-size: 1rem; }
            button { padding: 0 15px; }
            input[type="text"] { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>J.A.R.V.I.S.</h1>
    </header>

    <div class="chat-area" id="chatBox">
        <div class="message bot">
            SISTEMA INICIADO. VOZ EM MODO PROFUNDO. AGUARDANDO COMANDOS, SENHOR.
        </div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="DIGITE O COMANDO..." autocomplete="off">
        <button id="sendBtn">ENVIAR</button>
        <button id="micBtn">🎙️</button>
    </div>

    <div class="status-bar" id="statusText">SISTEMA OPERACIONAL</div>
</div>

<script>
    // CONFIGURAÇÃO DA API
    const API_KEY = "sk-hvnrnWWAFZQDygNaqXgT7vzaoAvdcIHeqopGanhZcaC80pxP";
    const BASE_URL = "https://api.chatanywhere.tech/v1";
    const MODEL = "gpt-3.5-turbo";

    // ELEMENTOS DOM
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');

    let isListening = false;
    let recognition = null;

    // ============================================================
    // CONFIGURAÇÃO DE VOZ EXTREMA (MAIS GROSSA POSSÍVEL)
    // ============================================================
    function getDeepVoiceUtterance(text) {
        if (!window.speechSynthesis) return null;
        
        const utterance = new SpeechSynthesisUtterance(text);
        
        // CONFIGURAÇÕES MÁXIMAS SOLICITADAS
        utterance.rate = 2.5;   // Velocidade Máxima (Super Rápido)
        utterance.pitch = 0.01; // Tom Mínimo Absoluto (Extremamente Grosso/Distorcido)
        utterance.volume = 1.0; // Volume Máximo
        utterance.lang = 'pt-BR';

        // Tentativa agressiva de selecionar vozes graves
        const voices = window.speechSynthesis.getVoices();
        
        // Lista de nomes de vozes que costumam ser graves em diferentes sistemas
        const deepVoiceNames = ['Google Português', 'Daniel', 'Fred', 'Luciano', 'Felipe', 'Male', 'Bruno', 'Antonio'];
        
        let selectedVoice = null;

        // 1. Tenta achar por nome específico
        for (let name of deepVoiceNames) {
            const found = voices.find(v => v.name.includes(name) && v.lang.includes('pt'));
            if (found) {
                selectedVoice = found;
                break;
            }
        }

        // 2. Se não achou, tenta qualquer voz em PT-BR
        if (!selectedVoice) {
            selectedVoice = voices.find(v => v.lang === 'pt-BR');
        }

        // 3. Fallback para qualquer voz disponível
        if (!selectedVoice && voices.length > 0) {
            selectedVoice = voices[0];
        }

        if (selectedVoice) {
            utterance.voice = selectedVoice;
        }

        return utterance;
    }

    function speak(text) {
        if (!window.speechSynthesis) return;
        
        // Cancela imediatamente qualquer fala anterior para não haver fila
        window.speechSynthesis.cancel();
        
        const utterance = getDeepVoiceUtterance(text);
        if (!utterance) return;

        // Pequeno timeout para garantir que o cancelamento funcionou antes de falar
        setTimeout(() => {
            window.speechSynthesis.speak(utterance);
            statusText.textContent = "FALANDO...";
        }, 100);

        utterance.onend = () => {
            statusText.textContent = "SISTEMA OPERACIONAL";
        };
        
        utterance.onerror = () => {
            statusText.textContent = "ERRO DE ÁUDIO";
        };
    }

    // INTERFACE
    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = 'typing';
        div.style.fontStyle = 'italic';
        div.style.opacity = '0.6';
        div.style.fontSize = '0.9rem';
        div.textContent = 'PROCESSANDO DADOS...';
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typing');
        if (el) el.remove();
    }

    // LÓGICA DA API
    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';
        showTyping();
        statusText.textContent = "CONECTANDO À REDE...";

        try {
            const response = await fetch(`${BASE_URL}/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [
                        { role: 'system', content: 'Você é JARVIS. Respostas curtas, diretas, técnicas e levemente sarcásticas. Fale como um sistema tático militar.' },
                        { role: 'user', content: text }
                    ],
                    max_tokens: 200,
                    temperature: 0.7
                })
            });

            hideTyping();
            
            if (!response.ok) throw new Error('Falha na conexão');
            
            const data = await response.json();
            const reply = data.choices[0].message.content;

            addMessage(reply, 'bot');
            statusText.textContent = "COMANDO EXECUTADO";
            
            // Falar a resposta com a voz configurada
            speak(reply);

        } catch (error) {
            hideTyping();
            addMessage("ERRO CRÍTICO: CONEXÃO PERDIDA.", 'bot');
            statusText.textContent = "ERRO DE SISTEMA";
            console.error(error);
        }
    }

    // EVENTOS
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // RECONHECIMENTO DE VOZ
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('mic-active');
            micBtn.textContent = '■';
            statusText.textContent = "ESCUTANDO...";
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('mic-active');
            micBtn.textContent = '🎙️';
            if (statusText.textContent === "ESCUTANDO...") {
                statusText.textContent = "SISTEMA OPERACIONAL";
            }
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userInput.value = transcript;
            setTimeout(() => {
                sendMessage();
            }, 200);
        };

        recognition.onerror = (event) => {
            console.warn("Erro mic:", event.error);
            isListening = false;
            micBtn.classList.remove('mic-active');
            micBtn.textContent = '🎙️';
            if(event.error === 'not-allowed') {
                statusText.textContent = "PERMISSÃO NEGADA";
            } else {
                statusText.textContent = "ERRO DE ÁUDIO";
            }
        };

        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    // Ignora se já estiver rodando
                }
            }
        });
    } else {
        micBtn.style.display = 'none';
        console.log("Navegador não suporta reconhecimento de voz");
    }

    // Garante carregamento das vozes no mobile
    if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = () => {
            // Força atualização da lista de vozes
            const v = window.speechSynthesis.getVoices();
            console.log("Voizes carregadas:", v.length);
        };
        // Trigger inicial para alguns navegadores
        setTimeout(() => {
             window.speechSynthesis.getVoices();
        }, 100);
    }
</script>

</body>
</html>
