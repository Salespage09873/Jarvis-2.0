<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. - Protocolo Grave</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: rgba(5, 10, 5, 0.9);
            --primary-color: #0a2f0a;
            --highlight-color: #00ff41;
            --text-color: #d0ffd0;
            --border-color: #1a4d1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Fundo Grid Tático */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--primary-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--primary-color) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.2;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--highlight-color);
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.4);
            letter-spacing: 3px;
        }

        .chat-area {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 2px;
            font-size: 1rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .message.bot {
            align-self: flex-start;
            border-left: 4px solid var(--highlight-color);
            background: rgba(0, 40, 0, 0.3);
            color: #e0ffe0;
            font-weight: 500;
        }

        .message.user {
            align-self: flex-end;
            border-right: 4px solid #008f11;
            background: rgba(0, 30, 0, 0.5);
            color: #fff;
            text-align: right;
        }

        .input-group {
            display: flex;
            gap: 10px;
            background: var(--panel-bg);
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-color);
            color: var(--highlight-color);
            padding: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            outline: none;
            border-radius: 2px;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            border-color: var(--highlight-color);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.15);
        }

        button {
            background: rgba(0, 40, 0, 0.7);
            border: 1px solid var(--border-color);
            color: var(--highlight-color);
            padding: 0 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        button:active {
            background: var(--highlight-color);
            color: #000;
            box-shadow: 0 0 15px var(--highlight-color);
        }

        button.mic-active {
            background: #2a0000;
            border-color: #ff3333;
            color: #ff3333;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }

        .status-bar {
            font-size: 0.75rem;
            color: #336633;
            text-align: center;
            margin-top: 10px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #1a4d1a; }
        ::-webkit-scrollbar-thumb:hover { background: #00ff41; }

        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }
            .container { padding: 10px; height: 100vh; }
            button { padding: 0 15px; font-size: 0.8rem; }
            .input-group { flex-wrap: wrap; }
            input[type="text"] { min-width: 200px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>J.A.R.V.I.S. <span style="font-size:0.5em; vertical-align: middle; opacity: 0.8;">VOZ PROFUNDA</span></h1>
    </header>

    <div class="chat-area" id="chatBox">
        <div class="message bot">
            Sistema de áudio recalibrado. Frequências graves maximizadas. Estou pronto, senhor.
        </div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="Digite seu comando..." autocomplete="off">
        <button id="sendBtn">ENVIAR</button>
        <button id="micBtn">🎙️</button>
    </div>

    <div class="status-bar" id="statusText">AGUARDANDO COMANDO...</div>
</div>

<script>
    // CONFIGURAÇÃO DA API
    const API_KEY = "sk-hvnrnWWAFZQDygNaqXgT7vzaoAvdcIHeqopGanhZcaC80pxP";
    const BASE_URL = "https://api.chatanywhere.tech/v1";
    const MODEL = "gpt-3.5-turbo";

    // ELEMENTOS DOM
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');

    let isListening = false;
    let recognition = null;
    let jarvisVoice = null;

    // ============================================================
    // LÓGICA DE VOZ ULTRA GRAVE
    // ============================================================
    function initVoice() {
        if (!window.speechSynthesis) return;

        const voices = window.speechSynthesis.getVoices();
        
        // Estratégia de Seleção de Voz:
        // 1. Procura explicitamente por vozes masculinas conhecidas (Google, Microsoft, Apple)
        // 2. Prioriza 'pt-BR' mas aceita 'en-US' se for mais grave (algumas vozes EN são mais profundas)
        
        jarvisVoice = voices.find(voice => 
            (voice.name.includes('Google') && voice.lang.includes('pt')) ||
            (voice.name.includes('Daniel') && voice.lang.includes('pt')) ||
            (voice.name.includes('Fred') && voice.lang.includes('pt')) ||
            (voice.name.includes('Luciano') && voice.lang.includes('pt')) ||
            (voice.name.includes('Male') && voice.lang.includes('pt')) ||
            // Fallback para vozes genéricas masculinas em inglês que soam bem graves
            (voice.name.includes('David') && voice.lang.includes('en')) ||
            (voice.name.includes('Fred') && voice.lang.includes('en'))
        );

        // Se não achar nenhuma específica, pega a primeira que tiver 'pt-BR'
        if (!jarvisVoice) {
            jarvisVoice = voices.find(voice => voice.lang === 'pt-BR') || voices[0];
        }

        console.log("Voz Selecionada:", jarvisVoice ? jarvisVoice.name : "Nenhuma");
    }

    // Carregar vozes (necessário em alguns navegadores mobile)
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = initVoice;
    }
    // Tentativa imediata
    initVoice();

    function speak(text) {
        if (!window.speechSynthesis) return;

        window.speechSynthesis.cancel(); // Interrompe fala anterior

        const utterance = new SpeechSynthesisUtterance(text);
        
        // CONFIGURAÇÕES EXTREMAS
        utterance.rate = 2.5;   // Muito rápido (quase urgente)
        utterance.pitch = 0.01; // O mínimo absoluto possível para ficar grave
        utterance.volume = 1.0; // Volume máximo
        utterance.lang = 'pt-BR';

        if (jarvisVoice) {
            utterance.voice = jarvisVoice;
        }

        // Ajuste extra para tentar garantir que o pitch baixo seja aplicado
        utterance.onstart = () => {
            statusText.textContent = "FALANDO...";
        };
        
        utterance.onend = () => {
            statusText.textContent = "AGUARDANDO COMANDO...";
        };

        window.speechSynthesis.speak(utterance);
    }

    // ============================================================
    // INTERFACE E CHAT
    // ============================================================
    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = 'typing';
        div.style.fontStyle = 'italic';
        div.style.opacity = '0.6';
        div.textContent = 'Processando...';
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typing');
        if (el) el.remove();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';
        showTyping();
        statusText.textContent = "CONECTANDO...";

        try {
            const response = await fetch(`${BASE_URL}/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [
                        { role: 'system', content: 'Você é JARVIS. Responda de forma curta, direta e técnica. Use tom sério.' },
                        { role: 'user', content: text }
                    ],
                    max_tokens: 200,
                    temperature: 0.7
                })
            });

            hideTyping();
            
            if (!response.ok) throw new Error('Erro de conexão');
            
            const data = await response.json();
            const reply = data.choices[0].message.content;

            addMessage(reply, 'bot');
            statusText.textContent = "COMANDO EXECUTADO";
            
            speak(reply);

        } catch (error) {
            hideTyping();
            addMessage("Falha na comunicação com o servidor.", 'bot');
            statusText.textContent = "ERRO";
            console.error(error);
        }
    }

    // ============================================================
    // EVENTOS E MICROFONE
    // ============================================================
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('mic-active');
            micBtn.textContent = '⏹';
            statusText.textContent = "OUVINDO...";
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('mic-active');
            micBtn.textContent = '🎙️';
            if (statusText.textContent === "OUVINDO...") statusText.textContent = "AGUARDANDO COMANDO...";
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userInput.value = transcript;
            setTimeout(() => sendMessage(), 200);
        };

        recognition.onerror = (event) => {
            isListening = false;
            micBtn.classList.remove('mic-active');
            micBtn.textContent = '🎙️';
            if(event.error === 'not-allowed') alert("Permissão de microfone negada.");
        };

        micBtn.addEventListener('click', () => {
            if (isListening) recognition.stop();
            else {
                try { recognition.start(); } catch(e) {}
            }
        });
    } else {
        micBtn.style.display = 'none';
    }
</script>

</body>
</html>
