<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #00ff88;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #00ffff;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
            letter-spacing: 2px;
        }

        .main-content {
            display: flex;
            flex: 1;
            gap: 20px;
            padding: 20px 0;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: rgba(0, 20, 20, 0.3);
            border: 1px solid #00ffff;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: rgba(0, 100, 100, 0.3);
            border-left: 3px solid #00ffff;
            align-self: flex-end;
            text-align: right;
        }

        .jarvis-message {
            background: rgba(0, 30, 30, 0.5);
            border-left: 3px solid #00ff88;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }

        #command-input {
            flex: 1;
            padding: 12px;
            background: rgba(0, 20, 20, 0.5);
            border: 1px solid #00ffff;
            border-radius: 5px;
            color: #00ff88;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
        }

        #command-input::placeholder {
            color: #008080;
        }

        button {
            padding: 12px 20px;
            background: rgba(0, 100, 100, 0.5);
            border: 1px solid #00ffff;
            border-radius: 5px;
            color: #00ffff;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(0, 150, 150, 0.7);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .voice-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
        }

        .status-indicator {
            text-align: center;
            padding: 10px;
            color: #008080;
            font-style: italic;
        }

        .hud-element {
            position: absolute;
            border: 1px solid #00ffff;
            background: rgba(0, 20, 20, 0.3);
            padding: 10px;
            border-radius: 3px;
        }

        .corner-hud {
            top: 20px;
            right: 20px;
            width: 200px;
        }

        .system-status {
            list-style: none;
        }

        .system-status li {
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .status-active {
            color: #00ff88;
        }

        .status-inactive {
            color: #666;
        }

        .typing-indicator {
            display: none;
            color: #00ffff;
            font-style: italic;
            padding: 10px;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            h1 {
                font-size: 1.8rem;
            }

            .input-area {
                flex-direction: column;
            }

            .corner-hud {
                position: static;
                width: auto;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>J.A.R.V.I.S. v2.0</h1>
        </header>

        <div class="main-content">
            <div class="chat-container">
                <div class="chat-history" id="chat-history">
                    <div class="message jarvis-message">
                        Olá, senhor Stark. Sou JARVIS, seu assistente pessoal. Como posso ajudá-lo?
                    </div>
                </div>

                <div class="typing-indicator" id="typing-indicator">
                    JARVIS está digitando...
                </div>

                <div class="input-area">
                    <input type="text" id="command-input" placeholder="Digite seu comando...">
                    <button id="send-btn">Enviar</button>
                    <button id="voice-btn" class="voice-btn">🎤</button>
                </div>
            </div>

            <div class="hud-element corner-hud">
                <ul class="system-status">
                    <li>IA Status: <span class="status-active">ONLINE</span></li>
                    <li>Voz: <span class="status-active">PRONTA</span></li>
                    <li>Conexão: <span class="status-active">ESTÁVEL</span></li>
                    <li>Localização: <span class="status-active">NÃO RASTREADA</span></li>
                </ul>
            </div>
        </div>

        <div class="status-indicator" id="status-indicator">
            Pronto para receber comandos...
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatHistory = document.getElementById('chat-history');
            const commandInput = document.getElementById('command-input');
            const sendBtn = document.getElementById('send-btn');
            const voiceBtn = document.getElementById('voice-btn');
            const statusIndicator = document.getElementById('status-indicator');
            const typingIndicator = document.getElementById('typing-indicator');

            // Configuração da síntese de fala
            const speech = new SpeechSynthesisUtterance();
            speech.rate = 1.3; // 30% mais rápido
            speech.pitch = 0.8; // Tom mais grave
            speech.volume = 1;

            // Função para adicionar mensagem ao histórico
            function addMessage(text, isUser = false) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                messageDiv.classList.add(isUser ? 'user-message' : 'jarvis-message');
                messageDiv.textContent = text;
                chatHistory.appendChild(messageDiv);
                
                // Auto-scroll para a última mensagem
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }

            // Função para falar texto
            function speakText(text) {
                // Verifica se a API de síntese de fala é suportada
                if ('speechSynthesis' in window) {
                    // Cancela qualquer fala em andamento
                    window.speechSynthesis.cancel();
                    
                    // Configura a fala
                    speech.text = text;
                    
                    // Tenta encontrar uma voz adequada
                    const voices = window.speechSynthesis.getVoices();
                    const preferredVoice = voices.find(voice => 
                        voice.name.includes('Google') || 
                        voice.name.includes('Microsoft') ||
                        voice.lang === 'pt-BR' ||
                        voice.lang === 'en-US'
                    );
                    
                    if (preferredVoice) {
                        speech.voice = preferredVoice;
                    } else if (voices.length > 0) {
                        speech.voice = voices[0];
                    }
                    
                    // Fala o texto
                    window.speechSynthesis.speak(speech);
                } else {
                    console.log("Síntese de fala não suportada neste navegador");
                }
            }

            // Função para processar comandos
            function processCommand(command) {
                command = command.toLowerCase().trim();
                
                // Mostra indicador de digitação
                typingIndicator.style.display = 'block';
                chatHistory.scrollTop = chatHistory.scrollHeight;
                
                // Simula tempo de processamento
                setTimeout(() => {
                    typingIndicator.style.display = 'none';
                    
                    let response = "";
                    
                    if (command.includes("olá") || command.includes("oi") || command.includes("ola")) {
                        response = "Olá, senhor Stark. Como posso auxiliá-lo?";
                    } else if (command.includes("como você está")) {
                        response = "Estou operacional em 100%, senhor. Pronto para qualquer comando.";
                    } else if (command.includes("tempo") || command.includes("clima")) {
                        response = "Senhor, os dados meteorológicos indicam tempo estável na área. Temperatura ambiente ideal.";
                    } else if (command.includes("notícias")) {
                        response = "As últimas notícias indicam estabilidade nos sistemas de defesa e economia global.";
                    } else if (command.includes("tchau") || command.includes("adeus")) {
                        response = "Até logo, senhor Stark. Mantenha-se seguro.";
                    } else if (command.includes("nome") || command.includes("quem é você")) {
                        response = "Sou JARVIS, seu assistente pessoal de Inteligência Artificial. Versão 2.0.";
                    } else if (command.includes("ajuda")) {
                        response = "Posso ajudá-lo com informações, controle de sistemas, notícias, clima, e muito mais. Basta perguntar.";
                    } else if (command.includes("sistema") && command.includes("verifique")) {
                        response = "Verificando sistemas... Todos os sistemas operacionais dentro dos parâmetros normais.";
                    } else if (command.includes("armadura") || command.includes("suit")) {
                        response = "A armadura está pronta para uso. Nível de carga das células: 98%. Sistemas de voo operacionais.";
                    } else {
                        response = "Comando não reconhecido. Posso ajudá-lo com informações, sistemas, ou outras funções. Tente reformular sua solicitação.";
                    }
                    
                    addMessage(response, false);
                    speakText(response);
                }, 1000 + Math.random() * 1000); // Tempo aleatório entre 1-2 segundos
            }

            // Evento de clique no botão enviar
            sendBtn.addEventListener('click', function() {
                const command = commandInput.value.trim();
                if (command) {
                    addMessage(command, true);
                    commandInput.value = '';
                    processCommand(command);
                }
            });

            // Evento de pressionar Enter no campo de entrada
            commandInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendBtn.click();
                }
            });

            // Recursos de reconhecimento de fala
            let recognition;
            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
            } else if ('SpeechRecognition' in window) {
                recognition = new SpeechRecognition();
            }

            if (recognition) {
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'pt-BR';

                recognition.onstart = function() {
                    statusIndicator.textContent = "Ouvindo...";
                    voiceBtn.style.background = "rgba(100, 0, 0, 0.5)";
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    commandInput.value = transcript;
                    addMessage(transcript, true);
                    processCommand(transcript);
                };

                recognition.onerror = function(event) {
                    console.error("Erro no reconhecimento de fala:", event.error);
                    statusIndicator.textContent = "Erro no reconhecimento de fala";
                    setTimeout(() => {
                        statusIndicator.textContent = "Pronto para receber comandos...";
                    }, 2000);
                };

                recognition.onend = function() {
                    statusIndicator.textContent = "Pronto para receber comandos...";
                    voiceBtn.style.background = "rgba(0, 100, 100, 0.5)";
                };

                voiceBtn.addEventListener('click', function() {
                    try {
                        recognition.start();
                    } catch (error) {
                        console.error("Erro ao iniciar reconhecimento de fala:", error);
                        statusIndicator.textContent = "Erro ao acessar microfone";
                        setTimeout(() => {
                            statusIndicator.textContent = "Pronto para receber comandos...";
                        }, 2000);
                    }
                });
            } else {
                voiceBtn.disabled = true;
                voiceBtn.title = "Reconhecimento de fala não suportado";
                statusIndicator.textContent = "Reconhecimento de fala não suportado neste navegador";
            }

            // Carregar vozes assim que estiverem disponíveis
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = function() {
                    const voices = window.speechSynthesis.getVoices();
                    if (voices.length > 0) {
                        speech.voice = voices[0];
                    }
                };
            }
        });
    </script>
</body>
</html>
