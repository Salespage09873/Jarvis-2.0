<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Ultimate Voice</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --panel: rgba(5, 10, 5, 0.9);
            --main: #00ff41;
            --dim: #003b00;
            --alert: #ff3333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--main);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Grid de fundo */
        body::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(rgba(0,255,65,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,255,65,0.03) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -1;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }
        header {
            text-align: center;
            border-bottom: 2px solid var(--main);
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        h1 { font-family: 'Orbitron'; font-size: 2rem; text-shadow: 0 0 10px var(--main); }
        
        .chat-box {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--dim);
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 20px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,255,65,0.05);
        }
        .msg {
            margin-bottom: 12px;
            padding: 10px 15px;
            border-radius: 2px;
            max-width: 85%;
            line-height: 1.4;
            font-size: 1.1rem;
        }
        .msg.user {
            align-self: flex-end;
            margin-left: auto;
            background: rgba(0, 50, 0, 0.4);
            border-right: 3px solid var(--main);
            text-align: right;
        }
        .msg.bot {
            align-self: flex-start;
            background: rgba(0, 20, 0, 0.6);
            border-left: 3px solid var(--main);
            color: #fff;
        }
        .input-area {
            display: flex;
            gap: 10px;
            background: var(--panel);
            padding: 10px;
            border: 1px solid var(--dim);
        }
        input {
            flex: 1;
            background: #000;
            border: 1px solid var(--dim);
            color: var(--main);
            padding: 12px;
            font-family: 'Rajdhani';
            font-size: 1.2rem;
            outline: none;
        }
        input:focus { border-color: var(--main); }
        button {
            background: var(--dim);
            color: var(--main);
            border: 1px solid var(--main);
            padding: 0 20px;
            font-family: 'Orbitron';
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:active { background: var(--main); color: #000; }
        button.listening {
            background: var(--alert);
            border-color: var(--alert);
            color: #fff;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .status {
            text-align: center;
            font-size: 0.8rem;
            color: #448844;
            margin-top: 10px;
            font-family: 'Orbitron';
        }
        
        /* Configuração de API no topo do chat para facilitar */
        .api-config {
            background: #111;
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #aaa;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .api-config input {
            font-size: 0.9rem;
            padding: 5px;
            flex: 1;
            color: #fff;
        }
        .hide-config {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>J.A.R.V.I.S.</h1>
        <div style="font-size: 0.8rem; letter-spacing: 2px;">SISTEMA DE VOZ PROFUNDA ATIVO</div>
    </header>

    <!-- Área para colar a chave facilmente se não quiser editar o código -->
    <div class="api-config" id="configPanel">
        <span>CHAVE ELEVENLABS:</span>
        <input type="password" id="apiKeyInput" placeholder="Cole sua chave sk_... aqui">
        <button onclick="saveKey()" style="padding: 5px 10px; font-size: 0.8rem;">SALVAR</button>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg bot">Sistemas online. Voz neural carregada. Aguardando comandos, senhor.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Digite ou fale..." autocomplete="off">
        <button id="sendBtn">ENVIAR</button>
        <button id="micBtn">🎙️</button>
    </div>
    
    <div class="status" id="statusText">PRONTO</div>
</div>

<script>
    // ============================================================
    // CONFIGURAÇÃO
    // ============================================================
    // 1. Coloque sua chave da ElevenLabs aqui entre as aspas
    // 2. Ou use o campo na tela para salvar no navegador
    let ELEVEN_KEY = ""; 
    
    // ID da voz "Adam" (A mais grave e profissional)
    const VOICE_ID = "pNInz6obpgDQGcFmaJgB"; 
    const API_URL = "https://api.elevenlabs.io/v1/text-to-speech/" + VOICE_ID;

    // Carregar chave salva
    if(localStorage.getItem('elevenKey')) {
        ELEVEN_KEY = localStorage.getItem('elevenKey');
        document.getElementById('apiKeyInput').value = ELEVEN_KEY;
        document.getElementById('configPanel').style.display = 'none';
    }

    function saveKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        if(key) {
            ELEVEN_KEY = key;
            localStorage.setItem('elevenKey', key);
            document.getElementById('configPanel').style.display = 'none';
            alert("Chave salva! JARVIS pronto.");
        } else {
            alert("Por favor, cole a chave primeiro.");
        }
    }

    // Elementos
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');

    let isListening = false;
    let recognition = null;

    // ============================================================
    // FUNÇÃO DE FALA (ELEVENLABS - VOZ REALMENTE GROSSA)
    // ============================================================
    async function speak(text) {
        if (!ELEVEN_KEY) {
            addMessage("⚠️ ERRO: Chave da API não configurada. Preencha o campo no topo.", 'bot');
            return;
        }

        statusText.textContent = "GERANDO ÁUDIO NEURAL...";
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'xi-api-key': ELEVEN_KEY
                },
                body: JSON.stringify({
                    text: text,
                    model_id: "eleven_monolingual_v1",
                    voice_settings: {
                        stability: 0.5,
                        similarity_boost: 0.75,
                        style: 0.0,
                        use_speaker_boost: true
                    }
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.detail?.message || "Erro na API");
            }

            const audioBlob = await response.blob();
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            
            // Tocar áudio
            audio.play();
            
            audio.onended = () => {
                statusText.textContent = "PRONTO";
                URL.revokeObjectURL(audioUrl);
            };

        } catch (error) {
            console.error(error);
            statusText.textContent = "ERRO DE VOZ";
            addMessage(`Erro de áudio: ${error.message}. Verifique sua chave.`, 'bot');
        }
    }

    // ============================================================
    // CHAT E API DE TEXTO (ChatAnywhere - Grátis)
    // ============================================================
    const TEXT_API_KEY = "sk-hvnrnWWAFZQDygNaqXgT7vzaoAvdcIHeqopGanhZcaC80pxP";
    const TEXT_URL = "https://api.chatanywhere.tech/v1/chat/completions";

    async function getResponse(userText) {
        addMessage(userText, 'user');
        userInput.value = '';
        statusText.textContent = "PROCESSANDO...";

        try {
            const res = await fetch(TEXT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${TEXT_API_KEY}`
                },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: [
                        { role: "system", content: "Você é JARVIS. Responda de forma curta, direta e técnica. Não use emojis." },
                        { role: "user", content: userText }
                    ]
                })
            });

            const data = await res.json();
            const reply = data.choices[0].message.content;
            
            addMessage(reply, 'bot');
            speak(reply); // Fala com voz grossa
            
        } catch (e) {
            addMessage("Erro de conexão com o núcleo.", 'bot');
            statusText.textContent = "ERRO";
        }
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Eventos
    sendBtn.onclick = () => getResponse(userInput.value.trim());
    userInput.onkeypress = (e) => { if(e.key === 'Enter') sendBtn.onclick(); };

    // Microfone
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            statusText.textContent = "OUVINDO...";
        };
        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            statusText.textContent = "PRONTO";
        };
        recognition.onresult = (e) => {
            const txt = e.results[0][0].transcript;
            getResponse(txt);
        };

        micBtn.onclick = () => {
            if(isListening) recognition.stop();
            else recognition.start();
        };
    } else {
        micBtn.style.display = 'none';
    }
</script>

</body>
</html>
