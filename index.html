<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S - Iron Man Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 150, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 100, 200, 0.02) 0%, transparent 50%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 150, 255, 0.01) 2px, rgba(0, 150, 255, 0.01) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0, 150, 255, 0.01) 2px, rgba(0, 150, 255, 0.01) 4px);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 5px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 
                0 0 60px rgba(0, 150, 255, 0.1),
                inset 0 0 60px rgba(0, 150, 255, 0.05);
            border: 1px solid rgba(0, 150, 255, 0.3);
            position: relative;
            z-index: 1;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                transparent 30%, 
                rgba(0, 150, 255, 0.1) 50%, 
                transparent 70%);
            border-radius: 5px;
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite;
        }
        @keyframes borderGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        h1 {
            color: #00d4ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 
                0 0 10px rgba(0, 212, 255, 0.5),
                0 0 20px rgba(0, 212, 255, 0.3),
                0 0 30px rgba(0, 212, 255, 0.2),
                0 0 40px rgba(0, 212, 255, 0.1);
            letter-spacing: 8px;
            animation: textPulse 2s ease-in-out infinite;
        }
        @keyframes textPulse {
            0%, 100% { text-shadow: 0 0 10px rgba(0, 212, 255, 0.5), 0 0 20px rgba(0, 212, 255, 0.3), 0 0 30px rgba(0, 212, 255, 0.2), 0 0 40px rgba(0, 212, 255, 0.1); }
            50% { text-shadow: 0 0 20px rgba(0, 212, 255, 0.8), 0 0 40px rgba(0, 212, 255, 0.6), 0 0 60px rgba(0, 212, 255, 0.4), 0 0 80px rgba(0, 212, 255, 0.2); }
        }
        .subtitle {
            color: #00a8cc;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 30px;
            letter-spacing: 4px;
            font-weight: 300;
            text-transform: uppercase;
            opacity: 0.8;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 20, 40, 0.6);
            padding: 15px 25px;
            border-radius: 3px;
            margin-bottom: 20px;
            color: #00d4ff;
            font-size: 0.9rem;
            border: 1px solid rgba(0, 150, 255, 0.2);
            font-family: 'Orbitron', sans-serif;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            position: relative;
        }
        .online { 
            background: #00ff88; 
            box-shadow: 0 0 15px #00ff88, 0 0 30px rgba(0, 255, 136, 0.5);
            animation: pulse-green 2s infinite;
        }
        .offline { 
            background: #ff3366; 
            box-shadow: 0 0 15px #ff3366, 0 0 30px rgba(255, 51, 102, 0.5);
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 15px #00ff88, 0 0 30px rgba(0, 255, 136, 0.5); }
            50% { box-shadow: 0 0 25px #00ff88, 0 0 50px rgba(0, 255, 136, 0.8); }
        }
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 15px #ff3366, 0 0 30px rgba(255, 51, 102, 0.5); }
            50% { box-shadow: 0 0 25px #ff3366, 0 0 50px rgba(255, 51, 102, 0.8); }
        }
        .chat-box {
            background: rgba(0, 10, 20, 0.7);
            border-radius: 3px;
            padding: 25px;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 150, 255, 0.15);
            position: relative;
        }
        .chat-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(180deg, rgba(0, 150, 255, 0.05) 0%, transparent 100%);
            pointer-events: none;
        }
        .message {
            display: flex;
            margin-bottom: 20px;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .message.user { justify-content: flex-end; }
        .message.bot { justify-content: flex-start; }
        .bubble {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 3px;
            font-size: 1rem;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
            font-weight: 300;
        }
        .user .bubble {
            background: linear-gradient(135deg, rgba(0, 150, 255, 0.2), rgba(0, 100, 200, 0.3));
            color: #00d4ff;
            border: 1px solid rgba(0, 150, 255, 0.3);
            border-right: 3px solid #00d4ff;
            font-family: 'Rajdhani', sans-serif;
        }
        .bot .bubble {
            background: rgba(0, 30, 60, 0.6);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-left: 3px solid #00ff88;
            font-family: 'Rajdhani', sans-serif;
        }
        .input-area {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            position: relative;
        }
        input[type="text"] {
            flex: 1;
            padding: 18px 25px;
            border-radius: 3px;
            border: 1px solid rgba(0, 150, 255, 0.3);
            background: rgba(0, 10, 20, 0.8);
            color: #00d4ff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            min-width: 150px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
        }
        input[type="text"]:focus {
            border-color: #00d4ff;
            background: rgba(0, 20, 40, 0.9);
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.2);
        }
        input[type="text"]::placeholder { color: #006688; }
        .btn {
            padding: 18px 30px;
            border: 1px solid rgba(0, 150, 255, 0.3);
            border-radius: 3px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 150, 255, 0.2), transparent);
            transition: 0.5s;
        }
        .btn:hover::before {
            left: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 150, 255, 0.2), rgba(0, 100, 200, 0.3));
            color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.2);
        }
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.4);
            border-color: #00d4ff;
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-micro {
            background: rgba(0, 20, 40, 0.6);
            color: #00a8cc;
            padding: 18px 22px;
        }
        .btn-micro:hover { 
            background: rgba(0, 30, 60, 0.8);
            color: #00d4ff;
            border-color: #00d4ff;
        }
        .btn-micro.listening { 
            background: rgba(255, 51, 102, 0.2); 
            color: #ff3366; 
            border-color: #ff3366; 
            animation: pulse-mic 1s infinite; 
        }
        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 51, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
        }
        .typing {
            color: #00a8cc;
            font-style: italic;
            animation: blink 1s infinite;
            padding: 8px 0;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #006688;
            font-size: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            opacity: 0.6;
        }
        .model-badge {
            background: rgba(0, 150, 255, 0.15);
            padding: 5px 15px;
            border-radius: 2px;
            color: #00d4ff;
            font-size: 0.75rem;
            border: 1px solid rgba(0, 150, 255, 0.3);
            font-family: 'Orbitron', sans-serif;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 10, 20, 0.5); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 150, 255, 0.3); border-radius: 3px; border: 1px solid rgba(0, 150, 255, 0.2); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 150, 255, 0.5); }
        
        /* HUD Elements */
        .hud-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(0, 150, 255, 0.4);
        }
        .hud-tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .hud-tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .hud-bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .hud-br { bottom: 10px; right: 10px; border-left: none; border-top: none; }
        
        .arc-reactor {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid rgba(0, 150, 255, 0.1);
            animation: rotate 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        .arc-reactor::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border-radius: 50%;
            border: 1px solid rgba(0, 150, 255, 0.15);
            animation: rotate 15s linear infinite reverse;
        }
        .arc-reactor::after {
            content: '';
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            bottom: 30px;
            border-radius: 50%;
            border: 1px solid rgba(0, 150, 255, 0.2);
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="arc-reactor"></div>

<div class="container">
    <div class="hud-corner hud-tl"></div>
    <div class="hud-corner hud-tr"></div>
    <div class="hud-corner hud-bl"></div>
    <div class="hud-corner hud-br"></div>
    
    <h1>J.A.R.V.I.S</h1>
    <div class="subtitle">Just A Rather Very Intelligent System</div>

    <div class="status-bar">
        <div class="status-indicator">
            <span class="status-dot online" id="statusDot"></span> 
            <span id="statusText">SYSTEM ONLINE</span>
        </div>
        <span class="model-badge" id="modelBadge">GPT-3.5-TURBO</span>
        <span id="usageInfo">200/DAY</span>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            <div class="bubble">Bem-vindo, senhor. Sistemas online e prontos para operar. Como posso auxiliá-lo hoje?</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Digite seu comando..." />
        <button class="btn btn-primary" id="sendBtn">EXECUTAR</button>
        <button class="btn btn-micro" id="micBtn" title="Ativar comando de voz">🎤</button>
    </div>

    <div class="footer">
        API: CHATANYWHERE • MODEL: GPT-3.5-TURBO • LIMIT: 200 CALLS/DAY
    </div>
</div>

<script>
// ============================================================
// CONFIGURAÇÃO DA API - COLE SUA CHAVE AQUI
// ============================================================
const API_KEY = "sk-hvnrnWWAFZQDygNaqXgT7vzaoAvdcIHeqopGanhZcaC80pxP";
const BASE_URL = "https://api.chatanywhere.tech/v1";
const MODEL = "gpt-3.5-turbo";

// ============================================================
// ELEMENTOS DOM
// ============================================================
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const modelBadge = document.getElementById('modelBadge');

modelBadge.textContent = MODEL.toUpperCase();

let isListening = false;
let recognition = null;

// ============================================================
// FUNÇÃO PARA ADICIONAR MENSAGEM AO CHAT
// ============================================================
function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    div.appendChild(bubble);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// ============================================================
// FUNÇÃO DE LOADING (digitando...)
// ============================================================
function showTyping() {
    const div = document.createElement('div');
    div.className = 'message bot';
    div.id = 'typingIndicator';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.textContent = 'PROCESSANDO DADOS...';
    div.appendChild(bubble);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

// ============================================================
// CHAMADA PARA A API - USANDO O MODELO CORRETO
// ============================================================
async function sendMessageToAI(userMessage) {
    try {
        showTyping();
        setStatus('offline', 'PROCESSANDO...');

        const response = await fetch(`${BASE_URL}/chat/completions`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: MODEL,
                messages: [
                    { role: 'system', content: 'Você é o JARVIS, a inteligência artificial do Tony Stark. Você é extremamente profissional, educado, eficiente e leal. Responda de forma clara, direta e técnica em português. Use um tom formal e sofisticado, como um mordomo britânico altamente treinado. Sempre se refira ao usuário como "senhor" ou "senhora". Seja conciso mas completo nas respostas.' },
                    { role: 'user', content: userMessage }
                ],
                max_tokens: 500,
                temperature: 0.7
            })
        });

        hideTyping();

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(`Erro ${response.status}: ${errorData.error?.message || response.statusText}`);
        }

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || 'Desculpe, não consegui processar sua solicitação no momento.';

        addMessage(reply, 'bot');
        setStatus('online', 'SYSTEM ONLINE');

        // ============================================================
        // TTS PROFISSIONAL COM VOZ MAIS GRAVE
        // ============================================================
        speakText(reply);

        return reply;

    } catch (error) {
        hideTyping();
        addMessage(`❌ ERRO NO SISTEMA: ${error.message}`, 'bot');
        setStatus('offline', 'SYSTEM ERROR');
        console.error('Erro na API:', error);
        return null;
    }
}

// ============================================================
// TEXTO-TO-SPEECH PROFISSIONAL
// ============================================================
function speakText(text) {
    if ('speechSynthesis' in window) {
        // Cancelar falas anteriores
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.9; // Um pouco mais lento para soar mais profissional
        utterance.pitch = 0.8; // Tom mais grave para soar mais sério
        utterance.volume = 1;
        
        // Tentar encontrar uma voz mais adequada
        const voices = window.speechSynthesis.getVoices();
        const preferredVoice = voices.find(voice => 
            voice.name.includes('Google') || 
            voice.name.includes('Male') || 
            voice.name.includes('Homem') ||
            voice.lang === 'pt-BR'
        );
        
        if (preferredVoice) {
            utterance.voice = preferredVoice;
        }
        
        window.speechSynthesis.speak(utterance);
    }
}

// Carregar vozes quando disponíveis
if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {
        // Vozes carregadas
    };
}

// ============================================================
// STATUS
// ============================================================
function setStatus(state, text) {
    statusDot.className = `status-dot ${state}`;
    statusText.textContent = text;
}

// ============================================================
// EVENTOS DE ENVIO
// ============================================================
function handleSend() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    userInput.value = '';
    userInput.focus();
    sendMessageToAI(text);
}

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSend();
});

// ============================================================
// RECONHECIMENTO DE VOZ (MICROFONE)
// ============================================================
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        micBtn.textContent = '⏹️';
        setStatus('offline', 'OUVINDO...');
    };

    recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎤';
        if (statusText.textContent === 'OUVINDO...') {
            setStatus('online', 'SYSTEM ONLINE');
        }
    };

    recognition.onerror = (event) => {
        console.warn('Erro no microfone:', event.error);
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎤';
        setStatus('online', 'SYSTEM ONLINE');
        if (event.error === 'not-allowed') {
            addMessage('⚠️ PERMISSÃO DE MICROFONE NECESSÁRIA', 'bot');
        }
    };

    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        setTimeout(() => handleSend(), 300);
    };

    micBtn.addEventListener('click', () => {
        if (isListening) {
            recognition.stop();
            return;
        }
        try {
            recognition.start();
        } catch (e) {
            console.warn('Já está ouvindo ou erro:', e);
        }
    });

} else {
    micBtn.style.display = 'none';
    console.warn('Navegador não suporta reconhecimento de voz.');
}

// ============================================================
// TESTE INICIAL - VERIFICA SE A CHAVE É VÁLIDA
// ============================================================
async function testConnection() {
    try {
        const response = await fetch(`${BASE_URL}/models`, {
            headers: { 'Authorization': `Bearer ${API_KEY}` }
        });
        if (response.ok) {
            setStatus('online', 'SYSTEM ONLINE');
            console.log('✅ SISTEMA CONECTADO COM SUCESSO!');
        } else {
            setStatus('offline', 'AUTH FAILURE');
            console.warn('⚠️ VERIFIQUE SUA CHAVE DE API');
        }
    } catch (e) {
        setStatus('offline', 'NO CONNECTION');
        console.warn('⚠️ NÃO FOI POSSÍVEL CONECTAR AO SISTEMA');
    }
}
testConnection();

console.log('🚀 J.A.R.V.I.S INICIADO COM SUCESSO!');
console.log(`📦 MODELO: ${MODEL.toUpperCase()} | LIMITE: 200 CHAMADAS/DIA`);
</script>

</body>
</html>
