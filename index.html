<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. - Ultimate Voice</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: rgba(5, 10, 5, 0.9);
            --primary-color: #0f380f;
            --highlight-color: #00ff41;
            --text-color: #cfc;
            --border-color: #1a4d1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--primary-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--primary-color) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--highlight-color);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .chat-area {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 2px;
            font-size: 1rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .message.bot {
            align-self: flex-start;
            border-left: 3px solid var(--highlight-color);
            background: rgba(0, 50, 0, 0.2);
            color: #e0ffe0;
        }

        .message.user {
            align-self: flex-end;
            border-right: 3px solid #008f11;
            background: rgba(0, 30, 0, 0.4);
            color: #fff;
            text-align: right;
        }

        .input-group {
            display: flex;
            gap: 10px;
            background: var(--panel-bg);
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            color: var(--highlight-color);
            padding: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            outline: none;
            border-radius: 2px;
        }

        input[type="text"]:focus {
            border-color: var(--highlight-color);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }

        button {
            background: rgba(0, 50, 0, 0.6);
            border: 1px solid var(--border-color);
            color: var(--highlight-color);
            padding: 0 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        button:active {
            background: var(--highlight-color);
            color: #000;
        }

        button.mic-active {
            background: #300;
            border-color: #f00;
            color: #f00;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        .status-bar {
            font-size: 0.8rem;
            color: #446644;
            text-align: center;
            margin-top: 10px;
            font-family: 'Orbitron', monospace;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #1a4d1a; }
        ::-webkit-scrollbar-thumb:hover { background: #00ff41; }

        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; letter-spacing: 2px; }
            .container { padding: 10px; height: 100vh; }
            .chat-area { margin-bottom: 10px; }
            button { padding: 0 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>J.A.R.V.I.S. <span style="font-size:0.5em; vertical-align: middle;">VOICE AI</span></h1>
    </header>

    <div class="chat-area" id="chatBox">
        <div class="message bot">
            Sistema de Voz Neural Ativado. Identidade: Adam (Profundo). Aguardando comandos, senhor.
        </div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="Comando..." autocomplete="off">
        <button id="sendBtn">ENVIAR</button>
        <button id="micBtn">🎙️</button>
    </div>

    <div class="status-bar" id="statusText">SISTEMA PRONTO</div>
</div>

<script>
    // ============================================================
    // CONFIGURAÇÃO DA ELEVENLABS (VOZ REAL GRAVE)
    // ============================================================
    
    // ⚠️ COLE SUA CHAVE DA ELEVENLABS ABAIXO ENTRE AS ASPAS
    const ELEVENLABS_API_KEY = "SUA_CHAVE_ELEVENLABS_AQUI"; 
    
    // ID da voz "Adam" (Uma das vozes mais graves e profissionais disponíveis)
    const VOICE_ID = "pNInz6obpgDQGcFmaJgB"; 
    
    // ============================================================
    // CONFIGURAÇÃO DA API DE TEXTO (CHATANYWHERE)
    // ============================================================
    const TEXT_API_KEY = "sk-hvnrnWWAFZQDygNaqXgT7vzaoAvdcIHeqopGanhZcaC80pxP";
    const TEXT_BASE_URL = "https://api.chatanywhere.tech/v1";
    const TEXT_MODEL = "gpt-3.5-turbo";

    // ELEMENTOS DOM
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');

    let isListening = false;
    let recognition = null;
    let isSpeaking = false;

    // ============================================================
    // FUNÇÃO DE FALA COM ELEVENLABS (VOZ REALISTA)
    // ============================================================
    async function speakWithElevenLabs(text) {
        if (!ELEVENLABS_API_KEY || ELEVENLABS_API_KEY === "SUA_CHAVE_ELEVENLABS_AQUI") {
            alert("⚠️ ERRO: Você precisa colar sua chave da ElevenLabs no código!\nVá em elevenlabs.io, pegue a API Key e cole na linha 165 do arquivo index.html");
            return;
        }

        statusText.textContent = "GERANDO ÁUDIO NEURAL...";
        isSpeaking = true;

        try {
            const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'xi-api-key': ELEVENLABS_API_KEY
                },
                body: JSON.stringify({
                    text: text,
                    model_id: "eleven_monolingual_v1", // Modelo rápido e preciso
                    voice_settings: {
                        stability: 0.5,
                        similarity_boost: 0.8,
                        style: 0.2,
                        use_speaker_boost: true
                    }
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.detail?.message || "Erro na API de Voz");
            }

            const audioBlob = await response.blob();
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);

            // Ajuste de velocidade (Playback Rate) para ser mais rápido
            audio.playbackRate = 1.2; // 20% mais rápido que o original
            
            audio.onplay = () => { statusText.textContent = "FALANDO..."; };
            audio.onended = () => { 
                statusText.textContent = "AGUARDANDO INPUT..."; 
                isSpeaking = false;
                URL.revokeObjectURL(audioUrl);
            };
            audio.onerror = () => {
                statusText.textContent = "ERRO DE ÁUDIO";
                isSpeaking = false;
            };

            await audio.play();

        } catch (error) {
            console.error("Erro ao falar:", error);
            statusText.textContent = "ERRO DE VOZ: " + error.message;
            isSpeaking = false;
            // Fallback para voz nativa se falhar
            fallbackSpeak("Erro no sistema de voz neural.");
        }
    }

    // Fallback caso a API falhe ou não tenha chave
    function fallbackSpeak(text) {
        if ('speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 2.5;
            u.pitch = 0.1;
            u.lang = 'pt-BR';
            window.speechSynthesis.speak(u);
        }
    }

    // ============================================================
    // INTERFACE E CHAT
    // ============================================================
    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = 'typing';
        div.style.fontStyle = 'italic';
        div.style.opacity = '0.7';
        div.textContent = 'Processando...';
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typing');
        if (el) el.remove();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';
        
        if (isSpeaking) {
            // Se estiver falando, cancela para ouvir o novo comando? 
            // Ou deixa terminar? Vamos deixar terminar para não cortar a frase.
        }

        showTyping();
        statusText.textContent = "CONECTANDO...";

        try {
            const response = await fetch(`${TEXT_BASE_URL}/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${TEXT_API_KEY}`
                },
                body: JSON.stringify({
                    model: TEXT_MODEL,
                    messages: [
                        { role: 'system', content: 'Você é JARVIS. Responda de forma curta, direta e profissional. Use tom sério.' },
                        { role: 'user', content: text }
                    ],
                    max_tokens: 200
                })
            });

            hideTyping();
            
            if (!response.ok) throw new Error('Falha na IA');
            
            const data = await response.json();
            const reply = data.choices[0].message.content;

            addMessage(reply, 'bot');
            statusText.textContent = "PROCESSANDO VOZ...";
            
            // Usa a voz nova e grossa
            speakWithElevenLabs(reply);

        } catch (error) {
            hideTyping();
            addMessage("Erro de conexão.", 'bot');
            statusText.textContent = "ERRO";
            console.error(error);
        }
